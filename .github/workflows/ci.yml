# CI for https://github.com/BCBP-SOLUTIONS-FZC-LLC/iam-delegation
#
# Flow:
#
#   validate-test ──────┐
#   build-image (×2) ───┤──► push (×2, push events only, needs quality too)
#   validate-quality ───┘
#
# This repo ships TWO binaries/images (LLD §16.1): cmd/server (HTTP API +
# cascade SQS consumer) and cmd/reconciler (the three delegation CronJobs).
# There is no existing multi-binary CI precedent among the sibling IAM
# repos to copy verbatim (iam-org-membership, the other server+reconciler
# repo, keeps its own ci.yml out of the set of files this scaffold was
# asked to read) — build-image is therefore parametrized as a
# `strategy.matrix` over {server, reconciler}, each leg building its own
# Dockerfile.<binary> into its own GHCR repository
# (iam-delegation-server / iam-delegation-reconciler). Document this choice
# here so a future reader doesn't go looking for a different pattern.
#
# DELIBERATE SCOPE TRIM vs. iam-tender-acl's ci.yml: this scaffold keeps to
# the three jobs explicitly asked for (validate-test, validate-quality,
# build-image) plus the push-on-main step folded into build-image itself,
# rather than iam-tender-acl's separate trivy/smoke/pr-summary/push jobs.
# Layer those back in later following iam-tender-acl's fuller pattern once
# this repo's own smoke/PR-summary conventions are decided — the
# trivy/cosign/attestation steps below are kept inline (not split into
# separate jobs) precisely so that re-introducing a dedicated job for one
# of them is a small, additive change.
#
# paths-ignore skips this entire (expensive) pipeline for commits that only
# touch Markdown docs or hand-maintained architecture diagrams.
name: CI

"on":
  push:
    branches: [main, master]
    paths-ignore: ['**.md', 'docs/architecture/**']
  pull_request:
    branches: [main, master]
    paths-ignore: ['**.md', 'docs/architecture/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  BUILDKIT_PROGRESS: plain

jobs:
  # ── runs in parallel with validate-quality + build-image ─────────────────
  validate-test:
    name: Validate / Test
    uses: ./.github/workflows/validate-test.yml
    secrets: inherit

  # ── runs in parallel with validate-test + build-image ────────────────────
  validate-quality:
    name: Validate / Quality
    uses: ./.github/workflows/validate-quality.yml
    secrets: inherit

  # ── runs in parallel with validate-test + validate-quality ───────────────
  # Matrix over the two binaries this repo ships. Each leg lints its own
  # Dockerfile first (hadolint failure exits before the expensive build ever
  # starts), builds to the GHA/registry cache, runs a Trivy CVE scan +
  # smoke test, and — on push events only — pushes + signs the image.
  build-image:
    name: Build image (${{ matrix.binary }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [validate-test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - binary: server
            dockerfile: Dockerfile.server
            image: ghcr.io/bcbp-solutions-fzc-llc/iam-delegation-server
          - binary: reconciler
            dockerfile: Dockerfile.reconciler
            image: ghcr.io/bcbp-solutions-fzc-llc/iam-delegation-reconciler
    permissions:
      contents: read
      packages: write
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Hadolint
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: ${{ matrix.dockerfile }}

      - name: Check .dockerignore exists
        run: test -f .dockerignore

      - name: Prepare Docker build
        id: cache
        env:
          REGISTRY_REF: ${{ matrix.image }}:buildcache
          CAN_PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: bash .github/scripts/docker-build-prep.sh

      - name: Log in to GHCR
        uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Build image → local + cache
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          load: true
          tags: iam-delegation-${{ matrix.binary }}-ci-test
          pull: ${{ github.event_name != 'pull_request' }}
          cache-from: ${{ steps.cache.outputs.from }}
          cache-to: ${{ steps.cache.outputs.to }}
          build-args: |
            BUILD_VERSION=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ steps.cache.outputs.SOURCE_DATE_EPOCH }}
          secrets: |
            go_private_token=${{ secrets.GO_PRIVATE_TOKEN }}

      - name: Cache Trivy DB
        uses: actions/cache@v6.0.0
        with:
          path: /tmp/trivy-cache
          key: trivy-db-${{ runner.os }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      - name: Trivy scan — CRITICAL / HIGH / UNKNOWN
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: iam-delegation-${{ matrix.binary }}-ci-test
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH,UNKNOWN
          ignore-unfixed: true
          cache-dir: /tmp/trivy-cache

      - name: Trivy scan — SARIF upload
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: iam-delegation-${{ matrix.binary }}-ci-test
          format: sarif
          output: trivy-results-${{ matrix.binary }}.sarif
          exit-code: '0'
          ignore-unfixed: true
          cache-dir: /tmp/trivy-cache

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4.37.0
        continue-on-error: true
        with:
          sarif_file: trivy-results-${{ matrix.binary }}.sarif
          category: ${{ matrix.binary }}

      - name: Smoke tests
        env:
          IMAGE_TAG: iam-delegation-${{ matrix.binary }}-ci-test
          BINARY: ${{ matrix.binary }}
        run: bash .github/scripts/smoke-tests.sh

      # ── push to GHCR on merge to main (needs validate-quality too) ───────
      - name: Docker metadata
        id: meta
        if: github.event_name == 'push'
        uses: docker/metadata-action@v6.1.0
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

      - name: Build and push
        id: pushed
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          platforms: linux/amd64
          pull: true
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ steps.cache.outputs.SOURCE_DATE_EPOCH }}
          secrets: |
            go_private_token=${{ secrets.GO_PRIVATE_TOKEN }}
          cache-from: |
            type=gha
            type=registry,ref=${{ matrix.image }}:buildcache
          cache-to: |
            type=gha,mode=max
            type=registry,ref=${{ matrix.image }}:buildcache,mode=max

      - name: Install Cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign image with Cosign
        if: github.event_name == 'push'
        run: |
          cosign sign --yes "${{ matrix.image }}@${{ steps.pushed.outputs.digest }}"

      - name: Verify image signature
        if: github.event_name == 'push'
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github\.com/${{ github.repository }}/.github/workflows/.*@refs/heads/(main|master)$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ matrix.image }}@${{ steps.pushed.outputs.digest }}"

      - name: Log image digest
        if: github.event_name == 'push'
        env:
          IMAGE_DIGEST: ${{ steps.pushed.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: bash .github/scripts/log-image-digest.sh

  # ── requires build-image (both legs) + validate-quality to have passed ───
  push-gate:
    name: Push gate
    runs-on: ubuntu-latest
    needs: [build-image, validate-quality]
    if: github.event_name == 'push'
    steps:
      - name: All images pushed and signed
        run: echo "Both iam-delegation-server and iam-delegation-reconciler images are pushed and verified."
