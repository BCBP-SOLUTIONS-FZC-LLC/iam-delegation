# Reusable workflow — quality gate.
# fmt · tidy · vet · lint (golangci-lint via go tool) · vuln-check ·
# Dockerfile checks (both server + reconciler images). Called by ci.yml and
# release.yml. Must pass before push/release; does NOT gate coverage, trivy,
# or smoke (those only need validate-test.yml).
name: Validate / Quality

"on":
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to check out (leave empty to use the caller ref)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            go.mod

      - name: Configure private module access
        run: |
          git config --global credential.helper store
          echo "https://x-access-token:${{ secrets.GO_PRIVATE_TOKEN }}@github.com" > ~/.git-credentials
          chmod 600 ~/.git-credentials

      - name: Download modules
        env:
          GOPRIVATE: github.com/BCBP-SOLUTIONS-FZC-LLC/*
          GONOSUMDB: github.com/BCBP-SOLUTIONS-FZC-LLC/*
        run: go mod download

      - name: Verify modules
        run: go mod verify

      # Workflow files must use literal operators, not HTML entity encodings.
      - name: Reject HTML-escaped operators in workflow files
        run: |
          if grep -REn '&(gt|lt|amp)' .github/workflows/ .github/scripts/; then
            echo "::error::Workflow or script files contain HTML entities. Use literal operators instead."
            exit 1
          fi

      # RLS-6 style CI gate (LLD §6.2, §13.1, §17.5 Case 5) — see
      # .github/scripts/check-forbidden-set-guc.sh for the full rationale.
      - name: Reject non-transaction-local SET app.tenant_id
        run: bash .github/scripts/check-forbidden-set-guc.sh

      # Events/outbox/dedup must pass through platform-events only — see
      # .github/scripts/check-forbidden-events-bypass.sh for the full
      # rationale.
      - name: Reject SNS/SQS/envelope bypass of platform-events
        run: bash .github/scripts/check-forbidden-events-bypass.sh

      # outbox_events must never be touched via hand-rolled SQL — see
      # .github/scripts/check-outbox-access.sh for the full rationale
      # (ported from iam-org-membership, where this exact bypass happened
      # once).
      - name: Reject hand-rolled SQL against outbox_events
        run: bash .github/scripts/check-outbox-access.sh

      # Metric naming convention gate — enforces Enterprise Platform Observability
      # Standard namespace/suffix/label-cardinality rules on metrics/metrics.go
      # and verifies that platform_dependency_* metrics are present (regression
      # guard for the GAP-020 / dependency-metrics additions).
      - name: Metric naming and namespace compliance
        run: bash .github/scripts/check-metric-namespacing.sh

      # Enterprise Platform Observability Standard — logs, metrics, and traces
      # must all flow through platform-gincommon.  Nine rules across three
      # signal families (L-1..L-4, M-1..M-3, T-1..T-2).  See
      # .github/scripts/check-observability-compliance.sh for the full
      # rationale and the explicit composition-root exemptions.
      - name: Enforce observability compliance (logs/metrics/traces via platform-gincommon)
        run: bash .github/scripts/check-observability-compliance.sh

      # Platform-events pipeline integrity — events/outbox/dedup must all
      # pass through platform-events only.  Eleven rules across three paths
      # (P-1..P-7, C-1..C-2, D-1..D-2).  Complements the two narrower
      # existing scripts (check-forbidden-events-bypass.sh,
      # check-outbox-access.sh) with call-site and composition-root checks.
      - name: Enforce platform-events pipeline integrity (events/outbox/dedup)
        run: bash .github/scripts/check-platform-events-compliance.sh

      # platform-pgcommon compliance — all DB connections, configuration, and
      # operations must pass through platform-pgcommon only.  Eleven rules
      # across four areas (PC-1..PC-3, CF-1..CF-3, TX-1..TX-3, OQ-1..OQ-2).
      # See .github/scripts/check-pgcommon-compliance.sh for full rationale.
      - name: Enforce pgcommon compliance (DB connections/config/operations)
        run: bash .github/scripts/check-pgcommon-compliance.sh

      - name: Format check
        run: |
          unformatted=$(gofmt -l cmd/ internal/ pkg/ 2>/dev/null || true)
          if [ -n "${unformatted}" ]; then
            echo "${unformatted}" | while IFS= read -r f; do
              echo "::error file=${f},title=Format check::Not formatted — run 'make fmt'"
            done
            exit 1
          fi

      - name: Tidy check
        run: |
          make tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "::error file=go.mod,title=Module drift::go.mod or go.sum is stale — run 'go mod tidy' and commit the result."
            exit 1
          fi

      - name: Vet
        run: make vet

      - name: Lint
        run: make lint

      - name: Vulnerability check
        run: |
          if ! make vuln-check; then
            echo "::error file=go.mod,title=Vulnerability found::govulncheck detected vulnerabilities — run 'make vuln-check' locally to view details."
            exit 1
          fi

      # Enforce digest-pinned FROM lines in the Dockerfile. Floating tags (e.g.
      # golang:1.26.6-bookworm without @sha256:...) can be silently overwritten by
      # upstream maintainers, breaking supply-chain guarantees. Run
      # `make pin-base-images` (requires docker) to update the pinned digests.
      - name: Dockerfile base image digest check
        run: |
          if grep -E '^FROM [^ @]+:[^ @]+( AS .+)?$' Dockerfile; then
            echo "::error file=Dockerfile,title=Unpinned base image::Dockerfile FROM lines must use digest-pinned references (e.g. golang:1.26.6-bookworm@sha256:...). Run 'make pin-base-images' to update."
            exit 1
          fi
          echo "Dockerfile base images are digest-pinned."
