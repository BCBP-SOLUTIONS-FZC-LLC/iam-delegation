# Reusable workflow — test gate.
# Race detector (unit · integration · rls) + coverage + arch lint + Swagger
# staleness + end-to-end tests. Called by ci.yml and release.yml. Gates the
# build-image job.
name: Validate / Test

"on":
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to check out (leave empty to use the caller ref)'
        type: string
        required: false
        default: ''
    outputs:
      pct:
        description: 'Total statement coverage percentage'
        value: ${{ jobs.test.outputs.pct }}

permissions:
  contents: read
  packages: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  COVERAGE_THRESHOLD: '95'

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      pct: ${{ steps.gate.outputs.pct }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            go.mod

      # Store credentials so go mod download can fetch private BCBP modules.
      # Mirrors the pattern used in platform-events ci.yml (secrets.GO_PRIVATE_TOKEN).
      - name: Configure private module access
        run: |
          git config --global credential.helper store
          echo "https://x-access-token:${{ secrets.GO_PRIVATE_TOKEN }}@github.com" > ~/.git-credentials
          chmod 600 ~/.git-credentials

      - name: Download modules
        env:
          GOPRIVATE: github.com/BCBP-SOLUTIONS-FZC-LLC/*
          GONOSUMDB: github.com/BCBP-SOLUTIONS-FZC-LLC/*
        run: go mod download

      - name: Verify modules
        run: go mod verify

      # Mandatory blocking gate: runs unit + integration (Testcontainers
      # Postgres+Valkey+SQS-compatible container) + rls (Testcontainers
      # Postgres) with -race and coverage, in parallel, merged into
      # coverage.out (§17 Testing Strategy). Any data race detected here
      # blocks all downstream jobs (build-image, release). Do NOT remove or
      # skip.
      - name: Tests — unit · integration · rls (race + coverage)
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'
        run: make test-ci

      # make test-ci already merges the unit/integration/rls coverage profiles
      # into coverage.out. Assert the combined statement coverage meets the
      # threshold. Do not lower it to make a failing PR pass.
      - name: Coverage threshold gate (≥ 95%)
        id: gate
        run: bash .github/scripts/coverage-gate.sh

      - name: Upload coverage report
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: coverage-report-${{ github.sha }}
          path: coverage.out
          if-no-files-found: ignore
          retention-days: 30

      # Enforces this service's Clean Architecture layering (defined in
      # .go-arch-lint.yml, LLD §6/§6.2): core/domain -> core/port ->
      # core/service, adapter/inbound and adapter/outbound depending only
      # on core (+ eventschema/api/observability), never on each other —
      # wired together only from cmd/server and cmd/reconciler.
      - name: Cache go-arch-lint binary
        uses: actions/cache@v6.1.0
        with:
          path: ~/go/bin
          key: go-arch-lint-${{ runner.os }}-v1.15.0

      - name: Architecture lint
        run: bash .github/scripts/arch-lint.sh

      # Regenerates Swagger docs from handler annotations and fails if the
      # committed artifacts (docs/swagger/) are stale.
      - name: Swagger staleness check
        run: bash .github/scripts/check-swagger-stale.sh

      # Validate AsyncAPI spec + event schemas via platform-schemagov (8 passes).
      # Mirrors iam-user-profile's validate-test.yml schema-gov check.
      # packages: read permission (workflow-level) lets GITHUB_TOKEN pull the image.
      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Schema governance — validate AsyncAPI + event schemas
        env:
          SCHEMA_GOV_IMAGE: ghcr.io/bcbp-solutions-fzc-llc/platform-schemagov:0.4
        run: |
          docker run --rm --platform linux/amd64 \
            -v "${{ github.workspace }}":/workspace \
            -e GITHUB_ACTIONS \
            "${SCHEMA_GOV_IMAGE}" validate \
            --asyncapi   api/asyncapi.yaml \
            --schema-dir internal/eventschema

      # End-to-end tests exercise the full HTTP router (DLG-1..7, DLG-I1..I4)
      # against real Postgres+Valkey, plus the cascade SQS consumer and both
      # reconciler crons against local Testcontainers (§17.4). Not part of
      # the coverage gate, but must still pass before anything downstream
      # builds on this ref.
      - name: End-to-end tests
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'
        run: make test-e2e
