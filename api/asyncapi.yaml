asyncapi: 3.0.0

info:
  title: iam-delegation events
  version: 1.0.0
  description: |
    Outbound events published to iam.delegation.events (SNS → SQS fan-out),
    plus the two Core-origin signals this service consumes on
    delegation-cascade-q (LLD §10).

    Wire format: each SNS message body is prefixed with an 18-byte AWS Glue
    Schema Registry header before the EventEnvelope JSON:
      byte 0     : header version (0x03)
      byte 1     : compression    (0x00 = none)
      bytes 2-17 : schema version UUID (big-endian)

    Glue registry : iam-delegation-events (ap-south-1, JSON data format).
    Schemas       : one per PUBLISHED event type, named identically to the
                    event `type` (PascalCase) — DelegationStarted,
                    DelegationEnded, DelegationReviewRequested (LLD §10.3.1).
                    MembershipRevoked / TenantMembershipsPurged are registered under
                    their producing services' own Glue registries, not
                    iam-delegation-events — they are documented below purely
                    as this service's consumer-side contract.

    Encoding is split between enqueue time (plain JSON written to the
    outbox, validated against the JSON Schemas in internal/eventschema/) and
    publish time (a Glue codec resolves and stamps the schema-version UUID
    into `dataschema` immediately before the SNS publish call) — see LLD
    §10.3.1.

    Ordering: events for one delegation are NOT strictly ordered across
    types (standard SNS gives no ordering guarantee). Payloads are
    self-contained snapshots (DLG-EVT-7) so a consumer applying them out of
    order converges to the correct latest state regardless of arrival order.

    ── Schema Evolution Rules ───────────────────────────────────────────────
    Backward-compatible changes (NEW Glue schema version UUID, SAME type):
      • Adding optional fields to a payload — consumers ignore unknown fields.
      • Widening an enum (e.g. a new `ended_reason` value).
      • Making a required field optional.

    Breaking changes (MUST bump type to <name>.v2, e.g. DelegationEnded.v2):
      • Removing or renaming a field.
      • Changing a field's type or format.
      • Narrowing an enum (removing a value).
      • Making an optional field required.

    When introducing a v2: publish BOTH the old and new type for one release
    cycle so consumers can migrate, then retire the old type — see
    x-version-governance.compaction-protocol below.

  x-forward-compatibility:
    summary: >-
      Non-breaking schema updates (added fields, widened enums) are
      registered in Glue and deployed WITHOUT requiring a consumer migration
      cycle. Consumers MUST be forward-compatible or they will silently drop
      or crash on new fields. schema-registry.yml's diff step emits ⚠
      warnings when such changes are detected.
    required-settings:
      go-encoding-json: "Do NOT call json.Decoder.DisallowUnknownFields(). Unknown fields are silently ignored by default."
      go-sonic: "Do NOT use sonic.ConfigStrict. Use sonic.ConfigDefault or sonic.ConfigFastest."
    open-schema-contract: >-
      All payload schemas in internal/eventschema/ declare
      "additionalProperties": true — an explicit signal that the shape is
      OPEN and new fields may appear in any Glue schema version without a
      version bump. CI's schema-gov validate Pass 5 rejects any schema that
      re-introduces "additionalProperties": false.

  x-semantic-contract:
    summary: >-
      JSON Schema structural diff cannot detect semantic drift: a field's
      units, scale, or business meaning can change without any structural
      difference (e.g. days_remaining meant business days, now means
      calendar days — type stays integer, but every consumer's
      interpretation is wrong).
    required-action: >-
      If a field's observable meaning changes (units, scale, encoding,
      nullability) without a structural change, create a versioned type
      (e.g. DelegationEnded.v2) and mark the old type deprecated — do not
      reuse an existing field name for a semantically different value.
      See the "Event Schema Semantic Evolution" PR-template checklist.

  x-version-governance:
    summary: >-
      Glue schema version numbers are internal counters that increment on
      every backward-compatible structural change. High version numbers
      (beyond SCHEMA_VERSIONS_ALERT_THRESHOLD, default 10) signal a schema
      that has been evolving in-place rather than being compacted into a
      clean .v2 event type.
    compaction-protocol: |
      When a schema exceeds the version threshold:
        1. Create  internal/eventschema/{name}_v2.json  (new field layout)
        2. Register {name}.v2 as a new AsyncAPI message in this file with
           x-lifecycle: {status: active}
        3. Mark the old message: x-lifecycle: {status: deprecated,
           deprecated-by: {name}.v2, retire-after: YYYY-MM-DD}
        4. Dual-publish from the producer for one release cycle
        5. Migrate all consumers to the .v2 type
        6. Retire the old type
    cleanup-cadence: |
      Monthly    (schema-prune.yml, schedule)            — dry-run orphan report; operator reviews and re-triggers with dry_run=false when ready.
      Quarterly  (schema-health-quarterly.yml, schedule) — lifecycle lint + version-accumulation scan; no mutations.
      Ad-hoc     (schema-prune.yml, workflow_dispatch)   — operator-triggered execute mode; production pruning is always manual.

  x-usage-override:
    summary: >-
      Escape hatch for Prometheus usage-classification false negatives. When
      usage-check reports NEVER_SEEN but the event is known to be active
      (metric delay, dashboard migration), add this annotation to a
      components/messages entry to suppress enforcement for a bounded
      window.
    format: |
      x-usage-override:
        status: active-override   # the only accepted value
        reason: "<why the usage signal is unreliable right now>"
        until:  YYYY-MM-DD        # remove the annotation on or after this date

  license:
    name: Proprietary

defaultContentType: application/json

tags:
  - $ref: '#/components/tags/published'
  - $ref: '#/components/tags/consumed'

servers:
  production:
    host: sns.ap-south-1.amazonaws.com
    protocol: sns
    description: |
      AWS SNS in ap-south-1. Topic ARN configured via the SNS_TOPIC_ARN env
      var. Pod IAM role requires, scoped to the iam-delegation-events Glue
      registry: glue:GetRegistry, glue:GetSchema, glue:GetSchemaVersion,
      glue:QuerySchemaVersionMetadata. Schema registration
      (glue:CreateSchema, glue:RegisterSchemaVersion) is CD-only.
    security:
      - $ref: '#/components/securitySchemes/iamRole'

  sqsDelegationCascade:
    host: sqs.ap-south-1.amazonaws.com
    protocol: sqs
    description: |
      SQS queue owned and managed by this service — delegation-cascade-q
      (DLQ: delegation-cascade-q-dlq, maxReceiveCount=5) — fed by a single
      upstream SNS topic this service does not own, via cross-topic
      subscriptions (LLD §10.1). Both consumed event types are produced by
      Core / Org & Membership on the SAME topic:
        iam.membership.events -> MembershipRevoked        (filter: EventType IN [MembershipRevoked])
        iam.membership.events -> TenantMembershipsPurged  (filter: EventType IN [TenantMembershipsPurged])
      TenantMembershipsPurged was renamed from TenantOffboarded by Core
      specifically to avoid colliding with Realm Provisioner's own,
      differently-scoped TenantOffboarded event on iam.tenant.events, which
      this service does NOT consume.
      Drives the delegate-side removal cascade (§11.5) and tenant-lifecycle
      cleanup (§11.6). Idempotent via processed_events keyed on the envelope
      id (UUID v7); a redelivery is a no-op. A message whose payload fails
      schema-decode is routed to the DLQ rather than retried indefinitely.
    security:
      - $ref: '#/components/securitySchemes/iamRole'

channels:
  iam/delegation/events:
    address: iam.delegation.events
    description: |
      Single dedicated SNS topic this service publishes to (DLG-Q1) — one
      topic, three event types, no RoutingPublisher.
    bindings:
      sns:
        name: iam-delegation-events
    messages:
      DelegationStarted:         { $ref: '#/components/messages/DelegationStarted' }
      DelegationEnded:           { $ref: '#/components/messages/DelegationEnded' }
      DelegationReviewRequested: { $ref: '#/components/messages/DelegationReviewRequested' }

  iam/delegation/cascade:
    address: delegation-cascade-q
    description: |
      This service's own SQS queue (delegation-cascade-q), not a topic it
      owns — subscribed to Core / Org & Membership's single SNS topic
      (iam.membership.events) per LLD §10.1, filtered to two event types.
      DLQ: delegation-cascade-q-dlq, maxReceiveCount=5.
    bindings:
      sqs:
        queue:
          name: delegation-cascade-q
          fifoQueue: false
    messages:
      MembershipRevoked: { $ref: '#/components/messages/MembershipRevoked' }
      TenantMembershipsPurged:  { $ref: '#/components/messages/TenantMembershipsPurged' }

operations:
  publishDelegationEvents:
    action: send
    channel:
      $ref: '#/channels/iam~1delegation~1events'
    tags:
      - $ref: '#/components/tags/published'
    summary: Publish delegation lifecycle events to iam.delegation.events
    messages:
      - $ref: '#/channels/iam~1delegation~1events/messages/DelegationStarted'
      - $ref: '#/channels/iam~1delegation~1events/messages/DelegationEnded'
      - $ref: '#/channels/iam~1delegation~1events/messages/DelegationReviewRequested'

  # ── Inbound operation — Core's removal/offboarding signals (LLD §10.1) ────
  consumeDelegationCascade:
    action: receive
    channel:
      $ref: '#/channels/iam~1delegation~1cascade'
    tags:
      - $ref: '#/components/tags/consumed'
    summary: Consume Core's removal/offboarding signals driving the delegate-side cascade
    description: |
      Consumer: this service (iam-delegation).
      Producer: Core / Org & Membership — both MembershipRevoked and
        TenantMembershipsPurged are published on the same topic,
        iam.membership.events. TenantMembershipsPurged is Core's own
        tenant-scrub relay, renamed from TenantOffboarded to avoid
        colliding with Realm Provisioner's differently-scoped
        TenantOffboarded event on iam.tenant.events, which this service
        does NOT consume.
      Queue: delegation-cascade-q | DLQ: delegation-cascade-q-dlq
        (maxReceiveCount=5).

      On MembershipRevoked: CascadeService.EndForUser ends every delegation
        row (as delegator or delegate) tied to the removed membership,
        emitting DelegationEnded(ended_reason=delegate_removed) for
        delegate-side rows only — delegator-side removal ends silently
        (DEL-7/DLG-EVT-4, §11.5).
      On TenantMembershipsPurged: CascadeService.ScrubTenant ends/cleans up every
        delegation row scoped to the tenant (§11.6).

      Idempotent via processed_events keyed on the envelope id (UUID v7); a
      redelivery is a no-op. A message whose payload fails schema-decode is
      routed to the DLQ rather than retried indefinitely.
    messages:
      - $ref: '#/channels/iam~1delegation~1cascade/messages/MembershipRevoked'
      - $ref: '#/channels/iam~1delegation~1cascade/messages/TenantMembershipsPurged'

components:
  securitySchemes:
    iamRole:
      type: httpApiKey
      name: Authorization
      in: header
      description: AWS IAM role attached to the pod via IRSA (IAM Roles for Service Accounts).

  tags:
    published:
      name: published
      description: |
        This service is the producer. Emitted onto the iam.delegation.events
        SNS topic via the transactional outbox (DLG-EVT-1): DelegationStarted,
        DelegationEnded, DelegationReviewRequested, and the publishDelegationEvents
        send operation all carry this tag.
    consumed:
      name: consumed
      description: |
        This service is the consumer, not the producer, of MembershipRevoked
        and TenantMembershipsPurged, both on iam.membership.events.
        Canonical schema ownership for anything tagged consumed sits with the
        producing service, not this file — treat these definitions as this
        service's consumer-side documentation (LLD §10.1), kept in sync with
        upstream, not as the source of truth.

  messageTraits:
    glueWireFormat:
      description: |
        Message body is prefixed with the 18-byte Glue Schema Registry
        wire-format header: [0x03][0x00][16-byte schema version UUID
        (big-endian)] followed by the JSON payload. Consumers must strip
        this header before parsing the EventEnvelope JSON.

  messages:
    DelegationStarted:
      name: DelegationStarted
      title: Delegation created (routing begins)
      summary: Emitted by DLG-2 create and the create leg of DLG-5 reassign.
      x-lifecycle:
        status: active    # active | deprecated | retired
      x-owner:
        team: iam-team
        slack: "#delegation-events"
      tags:
        - $ref: '#/components/tags/published'
      contentType: application/json
      traits:
        - $ref: '#/components/messageTraits/glueWireFormat'
      payload:
        $ref: '#/components/schemas/DelegationStartedPayload'
      bindings:
        sns:
          messageAttributes:
            EventType:
              dataType: String
              value: DelegationStarted
              description: PascalCase event type — used by consumer SNS filter policies.
            TenantID:
              dataType: String
              description: Dynamic — set from envelope.tenant_id at publish time.
            Source:
              dataType: String
              value: iam-delegation
            EventID:
              dataType: String
              description: Dynamic — RFC 4122 UUID v7 echoed from envelope.id.
            Subject:
              dataType: String
              description: Dynamic — set from envelope.subject (the delegation_id).

    DelegationEnded:
      name: DelegationEnded
      title: Delegation ended (routing restored)
      summary: |
        Fires on every end path — cancel, ends_at expiry, review auto-end,
        delegate-removed cascade (DLG-EVT-3) — never path-dependent.
        Delegator-side removal ends silently, no event (DEL-7/DLG-EVT-4).
      x-lifecycle:
        status: active    # active | deprecated | retired
      x-owner:
        team: iam-team
        slack: "#delegation-events"
      tags:
        - $ref: '#/components/tags/published'
      contentType: application/json
      traits:
        - $ref: '#/components/messageTraits/glueWireFormat'
      payload:
        $ref: '#/components/schemas/DelegationEndedPayload'
      bindings:
        sns:
          messageAttributes:
            EventType:
              dataType: String
              value: DelegationEnded
              description: PascalCase event type — used by consumer SNS filter policies.
            TenantID:
              dataType: String
              description: Dynamic — set from envelope.tenant_id at publish time.
            Source:
              dataType: String
              value: iam-delegation
            EventID:
              dataType: String
              description: Dynamic — RFC 4122 UUID v7 echoed from envelope.id.
            Subject:
              dataType: String
              description: Dynamic — set from envelope.subject (the delegation_id).

    DelegationReviewRequested:
      name: DelegationReviewRequested
      title: Open-ended delegation approaching its review deadline
      summary: Emitted by the delegation-review sweep once per calendar day for each of the 3 days before review_due_at (DLG-I2, DLG-D7).
      x-lifecycle:
        status: active    # active | deprecated | retired
      x-owner:
        team: iam-team
        slack: "#delegation-events"
      tags:
        - $ref: '#/components/tags/published'
      contentType: application/json
      traits:
        - $ref: '#/components/messageTraits/glueWireFormat'
      payload:
        $ref: '#/components/schemas/DelegationReviewRequestedPayload'
      bindings:
        sns:
          messageAttributes:
            EventType:
              dataType: String
              value: DelegationReviewRequested
              description: PascalCase event type — used by consumer SNS filter policies.
            TenantID:
              dataType: String
              description: Dynamic — set from envelope.tenant_id at publish time.
            Source:
              dataType: String
              value: iam-delegation
            EventID:
              dataType: String
              description: Dynamic — RFC 4122 UUID v7 echoed from envelope.id.
            Subject:
              dataType: String
              description: Dynamic — set from envelope.subject (the delegation_id).

    # ── Consumed messages (LLD §10.1) — producer is Core, not this service ──
    MembershipRevoked:
      name: MembershipRevoked
      title: Tenant membership revoked
      summary: |
        Consumed by this service (not published). Produced by Core / Org &
        Membership on iam.membership.events; drives
        CascadeService.EndForUser (§11.5, DLG-Q4/DLG-D14).
      tags:
        - $ref: '#/components/tags/consumed'
      contentType: application/json
      payload:
        $ref: '#/components/schemas/MembershipRevokedPayload'
      bindings:
        sns:
          messageAttributes:
            EventType:
              dataType: String
              value: MembershipRevoked
              description: Set by the producer. Matches this queue's SNS filter policy.
            TenantID:
              dataType: String
              description: Dynamic — envelope.tenant_id.
            Source:
              dataType: String
              description: Producing service identifier (Core / Org & Membership).
            EventID:
              dataType: String
              description: Dynamic — envelope id, used as the processed_events dedup key.

    TenantMembershipsPurged:
      name: TenantMembershipsPurged
      title: Tenant memberships purged
      summary: |
        Consumed by this service (not published). Produced by Core / Org &
        Membership on a real transition into the 'offboarded' tenant
        status (itself driven by Core having consumed Realm Provisioner's
        own TenantOffboarded event on a different queue); drives
        CascadeService.ScrubTenant (§11.6, DLG-Q4/DLG-D14). Renamed by
        Core from TenantOffboarded to avoid colliding with RP's event of
        that name.
      tags:
        - $ref: '#/components/tags/consumed'
      contentType: application/json
      payload:
        $ref: '#/components/schemas/TenantMembershipsPurgedPayload'
      bindings:
        sns:
          messageAttributes:
            EventType:
              dataType: String
              value: TenantMembershipsPurged
              description: Set by the producer. Matches this queue's SNS filter policy.
            TenantID:
              dataType: String
              description: Dynamic — envelope.tenant_id (the tenant being offboarded).
            Source:
              dataType: String
              description: Producing service identifier (Core / Org & Membership).
            EventID:
              dataType: String
              description: Dynamic — envelope id, used as the processed_events dedup key.

  schemas:
    # Shared envelope fields (embedded in every published message)
    EventEnvelope:
      type: object
      required: [id, source, tenant_id, trace_id, specversion, time, data]
      properties:
        id:          { type: string, format: uuid, description: UUID v7 — consumer dedup key }
        source:      { type: string, const: iam-delegation }
        specversion: { type: string, const: "1", description: "Message format semantic version — always \"1\" for this topic (events.WithSchemaVersion, DLG-D24)." }
        time:        { type: string, format: date-time }
        tenant_id:   { type: string, format: uuid }
        trace_id:    { type: string }
        subject:     { type: string, description: resource id (the delegation_id) }
        actor:       { type: string, format: uuid, description: who caused the event (audit) }
        dataschema:  { type: string, description: Glue Schema Registry version UUID }
        ip_address:  { type: string, description: "\"system\" on cron-origin events" }
        user_agent:  { type: string, description: iam-delegation/<cron>-cron on cron-origin events }

    DelegationStartedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          required: [delegation_id, delegator_id, delegate_id, scope, starts_at]
          properties:
            delegation_id: { type: string, format: uuid }
            delegator_id:  { type: string, format: uuid }
            delegate_id:   { type: string, format: uuid }
            scope:         { type: string, enum: [all, department, tender] }
            scope_id:      { type: string, format: uuid, nullable: true }
            starts_at:     { type: string, format: date-time }
            ends_at:       { type: string, format: date-time, nullable: true }

    DelegationEndedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          required: [delegation_id, delegator_id, delegate_id, ended_reason]
          properties:
            delegation_id: { type: string, format: uuid }
            delegator_id:  { type: string, format: uuid }
            delegate_id:   { type: string, format: uuid }
            ended_reason:  { type: string, enum: [expired, cancelled, delegate_removed, review_expired] }  # review_expired added (DLG-Q5)

    DelegationReviewRequestedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          required: [delegation_id, delegator_id, delegate_id, days_remaining]
          properties:
            delegation_id: { type: string, format: uuid }
            delegator_id:  { type: string, format: uuid }
            delegate_id:   { type: string, format: uuid }
            days_remaining: { type: integer, enum: [3, 2, 1] }   # the 3-day daily cascade (DLG-Q6)

    # ── Consumed payload schemas (LLD §10.1) — flat, no EventEnvelope allOf;
    # these mirror MembershipRevokedPayload/TenantMembershipsPurgedPayload exactly
    # as produced upstream (internal/core/domain/event_payloads.go).
    MembershipRevokedPayload:
      type: object
      required: [tenant_id, user_id, actor_id]
      properties:
        tenant_id: { type: string, format: uuid }
        user_id:   { type: string, format: uuid, description: The member whose tenant membership was revoked. }
        actor_id:  { type: string, format: uuid, description: Who performed the revocation. }

    TenantMembershipsPurgedPayload:
      type: object
      required: [tenant_id, actor_id]
      properties:
        tenant_id: { type: string, format: uuid }
        actor_id:  { type: string, format: uuid, description: Who performed the offboarding. }
