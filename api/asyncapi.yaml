asyncapi: 3.0.0

info:
  title: IAM Delegation Events
  version: 1.0.0
  description: |
    Outbound events published to iam.delegation.events (SNS → SQS fan-out),
    plus the three upstream signals this service consumes on
    delegation-cascade-q (LLD §10): two from Core (MembershipRevoked,
    TenantMembershipsPurged) and one from User Profile (UserUpdated, a
    second SNS subscription onto the same queue — Bug 2/DLG-D26).

    Wire format: each SNS message body is prefixed with an 18-byte AWS Glue
    Schema Registry header before the EventEnvelope JSON:
      byte 0     : header version (0x03)
      byte 1     : compression    (0x00 = none)
      bytes 2-17 : schema version UUID (big-endian)

    Glue registry : iam-delegation-events (ap-south-1, JSON data format).
    Schemas       : one per PUBLISHED event type, named identically to the
                    event `type` (PascalCase) — DelegationStarted,
                    DelegationEnded, DelegationReviewRequested,
                    DelegationEscalationRequested (Bug 2a/LLD §10.3.1).
                    MembershipRevoked / TenantMembershipsPurged / UserUpdated
                    are registered under their producing services' own Glue
                    registries, not iam-delegation-events — they are
                    documented below purely as this service's consumer-side
                    contract.

    Encoding is split between enqueue time (plain JSON written to the
    outbox, validated against the JSON Schemas in internal/eventschema/) and
    publish time (a Glue codec resolves and stamps the schema-version UUID
    into `dataschema` immediately before the SNS publish call) — see LLD
    §10.3.1.

    Ordering: events for one delegation are NOT strictly ordered across
    types (standard SNS gives no ordering guarantee). Payloads are
    self-contained snapshots (DLG-EVT-7) so a consumer applying them out of
    order converges to the correct latest state regardless of arrival order.

    ── Schema Evolution Rules ───────────────────────────────────────────────
    Backward-compatible changes (NEW Glue schema version UUID, SAME type):
      • Adding optional fields to a payload — consumers ignore unknown fields.
      • Widening an enum (e.g. a new `ended_reason` value).
      • Making a required field optional.

    Breaking changes (MUST bump type to <name>.v2, e.g. DelegationEnded.v2):
      • Removing or renaming a field.
      • Changing a field's type or format.
      • Narrowing an enum (removing a value).
      • Making an optional field required.

    When introducing a v2: publish BOTH the old and new type for one release
    cycle so consumers can migrate, then retire the old type — see
    x-version-governance.compaction-protocol below.

    ── Glue Schema Version / dataschema ────────────────────────────────────
    The 16-byte UUID in the Glue wire-format header (bytes 2-17) is the
    authoritative schema version identifier. The same UUID is echoed into
    the envelope JSON as `dataschema` so consumers that work with the
    decoded body can inspect or log it without re-parsing the binary header.
    The UUID is resolved from the Glue registry at startup and cached; it
    changes automatically whenever a new schema version is registered.
    In dev/test (NoopCodec path, GLUE_REGISTRY_NAME unset) there is no
    Glue header and `dataschema` is absent from the envelope.

    ── Failure Mode ────────────────────────────────────────────────────────
    GlueCodec fetches each published schema's version ID from Glue exactly
    once at startup (no retry). If any lookup fails the pod panics —
    Kubernetes restarts it (CrashLoopBackoff). This is intentional: a pod
    that cannot reach the Glue registry would silently produce malformed
    events rather than failing visibly.

    Resolution path:
      1. Verify GLUE_REGISTRY_NAME is correct and the registry/schemas exist.
      2. Verify the pod IAM role has glue:GetSchemaVersion on GLUE_REGISTRY_ARN.
      3. Fix the root cause — the pod recovers automatically on restart.
    Alert on outbox_dead_letters_total for events that fail after startup.

    ── Message Size Limit ───────────────────────────────────────────────────
    SNS hard limit: 256 KB per message (total wire size including the 18-byte
    Glue header and all SNS framing). A 240 KB soft limit is enforced at
    outbox-enqueue time by platform-events (pkg/outbox.Enqueue's
    maxEnvelopeBytes check). Delegation event payloads are small bounded
    structs; size is not a concern for any current event type.

  x-forward-compatibility:
    summary: >-
      Non-breaking schema updates (added fields, widened enums) are
      registered in Glue and deployed WITHOUT requiring a consumer migration
      cycle. Consumers MUST be forward-compatible or they will silently drop
      or crash on new fields. schema-registry.yml's diff step emits ⚠
      warnings when such changes are detected.
    required-settings:
      go-encoding-json: "Do NOT call json.Decoder.DisallowUnknownFields(). Unknown fields are silently ignored by default."
      go-sonic: "Do NOT use sonic.ConfigStrict. Use sonic.ConfigDefault or sonic.ConfigFastest."
    open-schema-contract: >-
      All payload schemas in internal/eventschema/ declare
      "additionalProperties": true — an explicit signal that the shape is
      OPEN and new fields may appear in any Glue schema version without a
      version bump. CI's schema-gov validate Pass 5 rejects any schema that
      re-introduces "additionalProperties": false.
    rollout-sequence:
      - "1. Register new schema version in Glue (UUID rotates; envelope.dataschema changes)"
      - "2. Deploy all consumers (ensure lenient deserialization settings below are in place)"
      - "3. Deploy producer (starts emitting new fields / wider enums)"
    java-jackson: "mapper.configure(DeserializationFeature.FAIL_ON_UNKNOWN_PROPERTIES, false) OR @JsonIgnoreProperties(ignoreUnknown=true) on every payload class."
    python-pydantic-v2: "model_config = ConfigDict(extra='ignore') on every payload model."
    kotlin-serialization: "Json { ignoreUnknownKeys = true } on the Json instance used to decode payloads."
    enum-safety: >-
      All switch/match/when on enum values MUST include a default/else branch.
      Enum widening is a backward-compatible change; new values appear in
      production without a consumer migration. An unhandled enum value crashes
      exhaustive matchers.
    ci-integration: >-
      schema-registry.yml's diff step emits ⚠ warnings when a non-breaking
      change affects forward-compatibility. CI blocks breaking changes
      entirely. Pass 5 of schema-gov validate additionally blocks any schema
      that declares additionalProperties: false — preventing the
      closed-schema anti-pattern from being re-introduced. Pass 6 scans Go
      source for DisallowUnknownFields and emits ::warning annotations so
      reviewers can confirm those sites do not decode iam.delegation.events
      or iam.membership.events payloads.

  x-semantic-contract:
    summary: >-
      JSON Schema structural diff cannot detect semantic drift: a field's
      units, scale, or business meaning can change without any structural
      difference (e.g. days_remaining meant business days, now means
      calendar days — type stays integer, but every consumer's
      interpretation is wrong).
    required-action: >-
      If a field's observable meaning changes (units, scale, encoding,
      nullability) without a structural change, create a versioned type
      (e.g. DelegationEnded.v2) and mark the old type deprecated — do not
      reuse an existing field name for a semantically different value.
      See the "Event Schema Semantic Evolution" PR-template checklist.
    detection: >-
      If field descriptions or titles change between Glue versions, the
      schema-registry.yml diff step emits a consumer_note. This is the only
      automated signal available — semantic intent lives in human-readable
      documentation, not in the JSON Schema type system.
    field-annotation-guidance: >-
      Annotate fields with semantic intent in their description. Example:
        days_remaining:
          type: integer
          description: "Calendar days (not business days) until review_due_at."
      Precise descriptions make semantic drift detectable during review.

  x-consumer-sdk:
    summary: >-
      Consumer SDKs MUST be configured for lenient decoding before
      subscribing to iam.delegation.events or delegation-cascade-q.
      The required settings are listed under x-forward-compatibility.
    in-repo-enforcement: >-
      CI Pass 6 (consumer strict-mode scan) greps this repository's Go
      source for DisallowUnknownFields. Matches emit ::warning annotations
      so reviewers can verify each site does not decode event payloads
      with strict deserialization. Test files and vendor/ are excluded.
    out-of-repo-guidance: >-
      External consumer services must enforce lenient decoding in their own
      codebase. Services using the platform-events SQS consumer get lenient
      mode by default (encoding/json defaults). Services that wrap raw
      message bytes must opt in explicitly — see
      x-forward-compatibility.required-settings for per-language settings.

  x-version-governance:
    summary: >-
      Glue schema version numbers are internal counters that increment on
      every backward-compatible structural change. High version numbers
      (beyond SCHEMA_VERSIONS_ALERT_THRESHOLD, default 10) signal a schema
      that has been evolving in-place rather than being compacted into a
      clean .v2 event type.
    compaction-protocol: |
      When a schema exceeds the version threshold:
        1. Create  internal/eventschema/{name}_v2.json  (new field layout)
        2. Register {name}.v2 as a new AsyncAPI message in this file with
           x-lifecycle: {status: active}
        3. Mark the old message: x-lifecycle: {status: deprecated,
           deprecated-by: {name}.v2, retire-after: YYYY-MM-DD}
        4. Dual-publish from the producer for one release cycle
        5. Migrate all consumers to the .v2 type
        6. Retire the old type
    cleanup-cadence: |
      Monthly    (schema-prune.yml, schedule)            — dry-run orphan report; operator reviews and re-triggers with dry_run=false when ready.
      Quarterly  (schema-health-quarterly.yml, schedule) — lifecycle lint + version-accumulation scan; no mutations.
      Ad-hoc     (schema-prune.yml, workflow_dispatch)   — operator-triggered execute mode; production pruning is always manual.

  x-usage-override:
    summary: >-
      Escape hatch for Prometheus usage-classification false negatives. When
      usage-check reports NEVER_SEEN but the event is known to be active
      (metric delay, dashboard migration), add this annotation to a
      components/messages entry to suppress enforcement for a bounded
      window.
    format: |
      x-usage-override:
        status: active-override   # the only accepted value
        reason: "<why the usage signal is unreliable right now>"
        until:  YYYY-MM-DD        # remove the annotation on or after this date

  license:
    name: Proprietary

defaultContentType: application/json

tags:
  - $ref: '#/components/tags/published'
  - $ref: '#/components/tags/consumed'

servers:
  production:
    host: sns.ap-south-1.amazonaws.com
    protocol: sns
    description: |
      AWS SNS in ap-south-1. Topic ARN configured via the SNS_TOPIC_ARN env
      var. Pod IAM role requires, scoped to the iam-delegation-events Glue
      registry: glue:GetRegistry, glue:GetSchema, glue:GetSchemaVersion,
      glue:QuerySchemaVersionMetadata. Schema registration
      (glue:CreateSchema, glue:RegisterSchemaVersion) is CD-only.
    security:
      - $ref: '#/components/securitySchemes/iamRole'

  sqsDelegationCascade:
    host: sqs.ap-south-1.amazonaws.com
    protocol: sqs
    description: |
      SQS queue owned and managed by this service — delegation-cascade-q
      (DLQ: delegation-cascade-q-dlq, maxReceiveCount=5) — fed by TWO
      upstream SNS topics this service does not own, via cross-topic
      subscriptions (LLD §10.1). Two event types are produced by Core / Org
      & Membership on one topic; a third is produced by User Profile on a
      second, distinct topic (Bug 2/DLG-D26):
        iam.membership.events -> MembershipRevoked        (filter: EventType IN [MembershipRevoked])
        iam.membership.events -> TenantMembershipsPurged  (filter: EventType IN [TenantMembershipsPurged])
        iam.user.events       -> UserUpdated               (filter: EventType IN [UserUpdated])
      TenantMembershipsPurged was renamed from TenantOffboarded by Core
      specifically to avoid colliding with Realm Provisioner's own,
      differently-scoped TenantOffboarded event on iam.tenant.events, which
      this service does NOT consume. UserUpdated's filter policy can only
      match on EventType ("UserUpdated", PascalCase — User Profile migrated
      from dot-notation while still undeployed, LLD rev 0.46; now consistent
      with Core above), not payload content, so most
      deliveries are unrelated field changes this service acks without
      dispatching; only a decoded payload with status="disabled" reaches
      CascadeService.EndForDisabledDelegate.
      Drives the delegate-side removal cascade (§11.5), tenant-lifecycle
      cleanup (§11.6), and the delegate-disabled cascade (§11.5a, Bug 2/2a).
      Idempotent via processed_events keyed on the envelope
      id (UUID v7); a redelivery is a no-op. A message whose payload fails
      schema-decode is routed to the DLQ rather than retried indefinitely.
    security:
      - $ref: '#/components/securitySchemes/iamRole'

channels:
  iam/delegation/events:
    address: iam.delegation.events
    description: |
      Single dedicated SNS topic this service publishes to (DLG-Q1) — one
      topic, four event types (Bug 2a added DelegationEscalationRequested),
      no RoutingPublisher.
    bindings:
      sns:
        name: iam-delegation-events
    messages:
      DelegationStarted:              { $ref: '#/components/messages/DelegationStarted' }
      DelegationEnded:                { $ref: '#/components/messages/DelegationEnded' }
      DelegationReviewRequested:      { $ref: '#/components/messages/DelegationReviewRequested' }
      DelegationEscalationRequested:  { $ref: '#/components/messages/DelegationEscalationRequested' }

  iam/delegation/cascade:
    address: delegation-cascade-q
    description: |
      This service's own SQS queue (delegation-cascade-q), not a topic it
      owns — subscribed to two upstream SNS topics per LLD §10.1: Core /
      Org & Membership's iam.membership.events (two event types) and User
      Profile's iam.user.events (one event type, Bug 2/DLG-D26).
      DLQ: delegation-cascade-q-dlq, maxReceiveCount=5.
    bindings:
      sqs:
        queue:
          name: delegation-cascade-q
          fifoQueue: false
    messages:
      MembershipRevoked:       { $ref: '#/components/messages/MembershipRevoked' }
      TenantMembershipsPurged: { $ref: '#/components/messages/TenantMembershipsPurged' }
      UserUpdated:              { $ref: '#/components/messages/UserUpdated' }

operations:
  publishDelegationEvents:
    action: send
    channel:
      $ref: '#/channels/iam~1delegation~1events'
    tags:
      - $ref: '#/components/tags/published'
    summary: Publish delegation lifecycle events to iam.delegation.events
    messages:
      - $ref: '#/channels/iam~1delegation~1events/messages/DelegationStarted'
      - $ref: '#/channels/iam~1delegation~1events/messages/DelegationEnded'
      - $ref: '#/channels/iam~1delegation~1events/messages/DelegationReviewRequested'
      - $ref: '#/channels/iam~1delegation~1events/messages/DelegationEscalationRequested'

  # ── Inbound operation — membership lifecycle signals from Core and
  # User Profile, driving the delegation cascade on this service ─────────────
  consumeDelegationCascade:
    action: receive
    channel:
      $ref: '#/channels/iam~1delegation~1cascade'
    tags:
      - $ref: '#/components/tags/consumed'
    summary: Consume membership lifecycle events to cascade-end affected delegations
    description: |
      Consumer: this service (iam-delegation).
      Producers: Core / Org & Membership — both MembershipRevoked and
        TenantMembershipsPurged are published on the same topic,
        iam.membership.events. TenantMembershipsPurged is Core's own
        tenant-scrub relay, renamed from TenantOffboarded to avoid
        colliding with Realm Provisioner's differently-scoped
        TenantOffboarded event on iam.tenant.events, which this service
        does NOT consume. Additionally, User Profile publishes UserUpdated
        on iam.user.events (Bug 2/DLG-D26) — a second, distinct upstream
        topic feeding the same delegation-cascade-q queue via its own SNS
        subscription.
      Queue: delegation-cascade-q | DLQ: delegation-cascade-q-dlq
        (maxReceiveCount=5).

      On MembershipRevoked: CascadeService.EndForUser ends every delegation
        row (as delegator or delegate) tied to the removed membership,
        emitting DelegationEnded(ended_reason=delegate_removed) for
        delegate-side rows only — delegator-side removal ends silently
        (DEL-7/DLG-EVT-4, §11.5).
      On TenantMembershipsPurged: CascadeService.ScrubTenant ends/cleans up every
        delegation row scoped to the tenant (§11.6).
      On UserUpdated with payload.status="disabled" (all other UserUpdated
        deliveries are acked without dispatch — the filter policy can only
        match on EventType, not payload content): CascadeService.
        EndForDisabledDelegate ends every active/scheduled delegation where
        the disabled user is the delegate, emitting BOTH
        DelegationEnded(ended_reason=delegate_disabled) AND
        DelegationEscalationRequested per row (§11.5a, Bug 2/2a) —
        deliberately without setting deleted_at (disabled ≠ removed) and
        without a User Profile pointer-clear call (already done atomically
        on User Profile's side before this event was even published).

      Idempotent via processed_events keyed on the envelope id (UUID v7); a
      redelivery is a no-op. A message whose payload fails schema-decode is
      routed to the DLQ rather than retried indefinitely.
    messages:
      - $ref: '#/channels/iam~1delegation~1cascade/messages/MembershipRevoked'
      - $ref: '#/channels/iam~1delegation~1cascade/messages/TenantMembershipsPurged'
      - $ref: '#/channels/iam~1delegation~1cascade/messages/UserUpdated'

components:
  securitySchemes:
    iamRole:
      type: httpApiKey
      name: Authorization
      in: header
      description: AWS IAM role attached to the pod via IRSA (IAM Roles for Service Accounts).

  tags:
    published:
      name: published
      description: |
        This service is the producer. Emitted onto the iam.delegation.events
        SNS topic via the transactional outbox (DLG-EVT-1): DelegationStarted,
        DelegationEnded, DelegationReviewRequested,
        DelegationEscalationRequested (Bug 2a), and the
        publishDelegationEvents send operation all carry this tag.
    consumed:
      name: consumed
      description: |
        This service is the consumer, not the producer, of MembershipRevoked
        and TenantMembershipsPurged (both on iam.membership.events), and of
        UserUpdated (on iam.user.events, Bug 2/DLG-D26 — a distinct
        upstream topic, not iam.membership.events).
        Canonical schema ownership for anything tagged consumed sits with the
        producing service, not this file — treat these definitions as this
        service's consumer-side documentation (LLD §10.1), kept in sync with
        upstream, not as the source of truth.

  messageTraits:
    glueWireFormat:
      description: |
        Message body is prefixed with the 18-byte Glue Schema Registry
        wire-format header: [0x03][0x00][16-byte schema version UUID
        (big-endian)] followed by the JSON payload. Consumers must strip
        this header before parsing the EventEnvelope JSON.

  messages:
    DelegationStarted:
      name: DelegationStarted
      title: Delegation started
      summary: >-
        Emitted when a delegation is created or when a previously scheduled
        delegation becomes active. Consumers should begin routing the
        delegator's work to the delegate from the starts_at timestamp.
      x-lifecycle:
        status: active    # active | deprecated | retired
      x-owner:
        team: iam-team
        slack: "#delegation-events"
      tags:
        - $ref: '#/components/tags/published'
      contentType: application/json
      traits:
        - $ref: '#/components/messageTraits/glueWireFormat'
      payload:
        $ref: '#/components/schemas/DelegationStartedPayload'
      bindings:
        sns:
          messageAttributes:
            EventType:
              dataType: String
              value: DelegationStarted
              description: PascalCase event type — used by consumer SNS filter policies.
            TenantID:
              dataType: String
              description: Dynamic — set from envelope.tenant_id at publish time.
            Source:
              dataType: String
              value: iam-delegation
            EventID:
              dataType: String
              description: Dynamic — RFC 4122 UUID v7 echoed from envelope.id.
            Subject:
              dataType: String
              description: Dynamic — set from envelope.subject (the delegation_id).

    DelegationEnded:
      name: DelegationEnded
      title: Delegation ended
      summary: >-
        Emitted when a delegation ends for any reason. The ended_reason field
        identifies the cause: expired (scheduled end date reached), cancelled
        (delegator cancelled manually), reassigned (replaced by a new
        delegation), delegate_removed (delegate left the tenant),
        review_expired (open-ended delegation lapsed at the review deadline),
        or delegate_disabled (delegate's account was disabled).
        Consumers should stop routing the delegator's work to the delegate.
      x-lifecycle:
        status: active    # active | deprecated | retired
      x-owner:
        team: iam-team
        slack: "#delegation-events"
      tags:
        - $ref: '#/components/tags/published'
      contentType: application/json
      traits:
        - $ref: '#/components/messageTraits/glueWireFormat'
      payload:
        $ref: '#/components/schemas/DelegationEndedPayload'
      bindings:
        sns:
          messageAttributes:
            EventType:
              dataType: String
              value: DelegationEnded
              description: PascalCase event type — used by consumer SNS filter policies.
            TenantID:
              dataType: String
              description: Dynamic — set from envelope.tenant_id at publish time.
            Source:
              dataType: String
              value: iam-delegation
            EventID:
              dataType: String
              description: Dynamic — RFC 4122 UUID v7 echoed from envelope.id.
            Subject:
              dataType: String
              description: Dynamic — set from envelope.subject (the delegation_id).

    DelegationReviewRequested:
      name: DelegationReviewRequested
      title: Delegation review reminder
      summary: >-
        Emitted once per calendar day for each of the three days before an
        open-ended delegation's review deadline. Signals that the delegator
        should decide whether to extend, reassign, or allow the delegation to
        lapse. The days_remaining field indicates how many calendar days remain
        (3, 2, or 1).
      x-lifecycle:
        status: active    # active | deprecated | retired
      x-owner:
        team: iam-team
        slack: "#delegation-events"
      tags:
        - $ref: '#/components/tags/published'
      contentType: application/json
      traits:
        - $ref: '#/components/messageTraits/glueWireFormat'
      payload:
        $ref: '#/components/schemas/DelegationReviewRequestedPayload'
      bindings:
        sns:
          messageAttributes:
            EventType:
              dataType: String
              value: DelegationReviewRequested
              description: PascalCase event type — used by consumer SNS filter policies.
            TenantID:
              dataType: String
              description: Dynamic — set from envelope.tenant_id at publish time.
            Source:
              dataType: String
              value: iam-delegation
            EventID:
              dataType: String
              description: Dynamic — RFC 4122 UUID v7 echoed from envelope.id.
            Subject:
              dataType: String
              description: Dynamic — set from envelope.subject (the delegation_id).

    DelegationEscalationRequested:
      name: DelegationEscalationRequested
      title: Delegation escalation requested
      summary: >-
        Emitted alongside DelegationEnded when a delegation ends because the
        delegate's account was disabled. Notifies tenant administrators and
        tenant owners so they can manually reassign the work. This service
        does not auto-create a replacement delegation — the escalation is
        notify-only. Always co-emitted with DelegationEnded in the same
        transaction; reason is always delegate_disabled.
      x-lifecycle:
        status: active    # active | deprecated | retired
      x-owner:
        team: iam-team
        slack: "#delegation-events"
      tags:
        - $ref: '#/components/tags/published'
      contentType: application/json
      traits:
        - $ref: '#/components/messageTraits/glueWireFormat'
      payload:
        $ref: '#/components/schemas/DelegationEscalationRequestedPayload'
      bindings:
        sns:
          messageAttributes:
            EventType:
              dataType: String
              value: DelegationEscalationRequested
              description: PascalCase event type — used by consumer SNS filter policies.
            TenantID:
              dataType: String
              description: Dynamic — set from envelope.tenant_id at publish time.
            Source:
              dataType: String
              value: iam-delegation
            EventID:
              dataType: String
              description: Dynamic — RFC 4122 UUID v7 echoed from envelope.id.
            Subject:
              dataType: String
              description: Dynamic — set from envelope.subject (the delegation_id).

    # ── Consumed messages (LLD §10.1) — producer is Core, not this service ──
    MembershipRevoked:
      name: MembershipRevoked
      title: Tenant membership revoked
      summary: >-
        Produced by the Org & Membership service when a user's tenant
        membership is removed. This service consumes it to end all active and
        scheduled delegations where the removed user is the delegator or the
        delegate. Only delegate-side delegations emit a DelegationEnded event;
        delegator-side delegations end silently.
      x-lifecycle:
        status: active
      x-owner:
        team: iam-core-team
        slack: "#iam-org-membership"
        note: "Schema ownership stays with the producing service (iam-org-membership). This definition is this service's consumer-side documentation only."
      tags:
        - $ref: '#/components/tags/consumed'
      contentType: application/json
      payload:
        $ref: '#/components/schemas/MembershipRevokedPayload'
      bindings:
        sns:
          messageAttributes:
            EventType:
              dataType: String
              value: MembershipRevoked
              description: Set by the producer. Matches this queue's SNS filter policy.
            TenantID:
              dataType: String
              description: Dynamic — envelope.tenant_id.
            Source:
              dataType: String
              description: Producing service identifier (Core / Org & Membership).
            EventID:
              dataType: String
              description: Dynamic — envelope id, used as the processed_events dedup key.

    TenantMembershipsPurged:
      name: TenantMembershipsPurged
      title: Tenant memberships purged
      summary: >-
        Produced by the Org & Membership service when a tenant is fully
        offboarded. This service consumes it to soft-delete all delegation
        records and tenant policy settings for the offboarded tenant. No
        individual DelegationEnded events are emitted — the deletion is a
        bulk cleanup operation.
      x-lifecycle:
        status: active
      x-owner:
        team: iam-core-team
        slack: "#iam-org-membership"
        note: "Schema ownership stays with the producing service (iam-org-membership). This definition is this service's consumer-side documentation only."
      tags:
        - $ref: '#/components/tags/consumed'
      contentType: application/json
      payload:
        $ref: '#/components/schemas/TenantMembershipsPurgedPayload'
      bindings:
        sns:
          messageAttributes:
            EventType:
              dataType: String
              value: TenantMembershipsPurged
              description: Set by the producer. Matches this queue's SNS filter policy.
            TenantID:
              dataType: String
              description: Dynamic — envelope.tenant_id (the tenant being offboarded).
            Source:
              dataType: String
              description: Producing service identifier (Core / Org & Membership).
            EventID:
              dataType: String
              description: Dynamic — envelope id, used as the processed_events dedup key.

    UserUpdated:
      name: UserUpdated
      title: User profile updated
      summary: >-
        Produced by the User Profile service when a user's profile fields
        change. This service acts only when the changed_fields array includes
        status and the new status value is disabled — ending all active and
        scheduled delegations where the disabled user is the delegate, and
        requesting escalation to tenant administrators. All other deliveries
        (name changes, preference updates, etc.) are acknowledged without any
        action. Only the fields this service reads are documented here; the
        full UserUpdated payload is defined in iam-user-profile's own AsyncAPI.
      x-lifecycle:
        status: active
      x-owner:
        team: iam-user-platform
        slack: "#user-events"
        note: "Schema ownership stays with the producing service (iam-user-profile). This definition documents only the subset of fields this service reads."
      tags:
        - $ref: '#/components/tags/consumed'
      contentType: application/json
      payload:
        $ref: '#/components/schemas/UserUpdatedPayload'
      bindings:
        sns:
          messageAttributes:
            EventType:
              dataType: String
              value: UserUpdated
              description: Set by the producer (PascalCase). Matches this queue's SNS filter policy.
            TenantID:
              dataType: String
              description: Dynamic — envelope.tenant_id. UserUpdatedPayload itself carries no tenant_id field.
            Source:
              dataType: String
              description: Producing service identifier (iam-user-profile).
            EventID:
              dataType: String
              description: Dynamic — envelope id, used as the processed_events dedup key.

  schemas:
    # Shared envelope fields (embedded in every published message)
    EventEnvelope:
      type: object
      required: [id, source, tenant_id, trace_id, specversion, time, data]
      properties:
        id:          { type: string, format: uuid, description: UUID v7 — consumer dedup key }
        source:      { type: string, const: iam-delegation }
        specversion: { type: string, const: "1", description: "Message format semantic version — always \"1\" for this topic (events.WithSchemaVersion, DLG-D24)." }
        time:        { type: string, format: date-time }
        tenant_id:   { type: string, format: uuid }
        trace_id:    { type: string }
        subject:     { type: string, description: resource id (the delegation_id) }
        actor:       { type: string, format: uuid, description: who caused the event (audit) }
        dataschema:  { type: string, description: Glue Schema Registry version UUID }
        ip_address:  { type: string, description: "\"system\" on cron-origin events" }
        user_agent:  { type: string, description: iam-delegation/<cron>-cron on cron-origin events }

    DelegationStartedPayload:
      additionalProperties: true
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          additionalProperties: true
          required: [delegation_id, delegator_id, delegate_id, scope, starts_at]
          properties:
            delegation_id: { type: string, format: uuid }
            tenant_id:     { type: string, format: uuid, description: Self-contained snapshot (DLG-EVT-7) — repeated here even though it also appears at the envelope level. }
            delegator_id:  { type: string, format: uuid }
            delegate_id:   { type: string, format: uuid }
            scope:         { type: string, enum: [all, department, tender] }
            scope_id:      { type: string, format: uuid, nullable: true }
            starts_at:     { type: string, format: date-time }
            ends_at:       { type: string, format: date-time, nullable: true }
            actor_id:      { type: string, format: uuid, description: Who triggered this create/reassign — the requestctx caller, or a system sentinel on the create leg of an automated flow. }

    DelegationEndedPayload:
      additionalProperties: true
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          additionalProperties: true
          required: [delegation_id, delegator_id, delegate_id, ended_reason]
          properties:
            delegation_id: { type: string, format: uuid }
            tenant_id:     { type: string, format: uuid, description: Self-contained snapshot (DLG-EVT-7) — repeated here even though it also appears at the envelope level. }
            delegator_id:  { type: string, format: uuid }
            delegate_id:   { type: string, format: uuid }
            scope:         { type: string, enum: [all, department, tender] }
            scope_id:      { type: string, format: uuid, nullable: true }
            ended_reason:  { type: string, enum: [expired, cancelled, reassigned, delegate_removed, review_expired, delegate_disabled] }  # review_expired added (DLG-Q5); delegate_disabled added (Bug 2/DLG-D26); reassigned added (DLG-5)
            actor_id:      { type: string, format: uuid, description: Who triggered the end — the requestctx caller for cancel/reassign, or SystemActorID for cron/cascade-driven ends. }

    DelegationReviewRequestedPayload:
      additionalProperties: true
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          additionalProperties: true
          required: [delegation_id, delegator_id, delegate_id, days_remaining]
          properties:
            delegation_id: { type: string, format: uuid }
            tenant_id:     { type: string, format: uuid, description: Self-contained snapshot (DLG-EVT-7) — repeated here even though it also appears at the envelope level. }
            delegator_id:  { type: string, format: uuid }
            delegate_id:   { type: string, format: uuid }
            scope:         { type: string, enum: [all, department, tender] }
            scope_id:      { type: string, format: uuid, nullable: true }
            days_remaining: { type: integer, enum: [3, 2, 1] }   # the 3-day daily cascade (DLG-Q6)
            actor_id:      { type: string, format: uuid, description: Always SystemActorID — this only ever fires from the review-sweep cron. }

    DelegationEscalationRequestedPayload:
      additionalProperties: true
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          additionalProperties: true
          required: [delegation_id, delegator_id, delegate_id, reason]
          properties:
            delegation_id: { type: string, format: uuid }
            tenant_id:     { type: string, format: uuid, description: Self-contained snapshot (DLG-EVT-7) — repeated here even though it also appears at the envelope level. }
            delegator_id:  { type: string, format: uuid }
            delegate_id:   { type: string, format: uuid, description: The now-disabled delegate whose grant just ended. }
            scope:         { type: string, enum: [all, department, tender] }
            scope_id:      { type: string, format: uuid, nullable: true }
            reason:        { type: string, enum: [delegate_disabled] }   # Bug 2a — the only trigger this service currently recognizes
            actor_id:      { type: string, format: uuid, description: Always SystemActorID — this only ever fires from the background delegate-disabled cascade, never a human action. }

    # ── Consumed payload schemas (LLD §10.1) — flat, no EventEnvelope allOf;
    # these mirror MembershipRevokedPayload/TenantMembershipsPurgedPayload exactly
    # as produced upstream (internal/core/domain/event_payloads.go).
    MembershipRevokedPayload:
      type: object
      additionalProperties: true
      required: [tenant_id, user_id, actor_id]
      properties:
        tenant_id: { type: string, format: uuid }
        user_id:   { type: string, format: uuid, description: The member whose tenant membership was revoked. }
        actor_id:  { type: string, format: uuid, description: Who performed the revocation. }

    TenantMembershipsPurgedPayload:
      type: object
      additionalProperties: true
      required: [tenant_id, actor_id]
      properties:
        tenant_id: { type: string, format: uuid }
        actor_id:  { type: string, format: uuid, description: Who performed the offboarding. }

    UserUpdatedPayload:
      type: object
      additionalProperties: true
      description: |
        Flat, no EventEnvelope allOf — mirrors the subset of
        iam-user-profile's UserUpdatedPayload this service actually reads
        (internal/core/domain/event_payloads.go). No tenant_id field of its
        own; this service uses the envelope's tenant_id instead. Carries no
        Email field either — this service never reads it, even though
        User Profile's own contract populates it when relevant.
      required: [user_id, changed_fields]
      properties:
        user_id:        { type: string, format: uuid }
        changed_fields:
          type: array
          items: { type: string }
          description: Full enum lives in iam-user-profile's own asyncapi.yaml; this service only branches on "status" being present.
        status:
          type: string
          enum: [active, disabled, deleted]
          description: |
            Populated only when "status" is in changed_fields (added to
            iam-user-profile's contract for Bug 2/DLG-D26 specifically so
            this service could react to it — changed_fields alone cannot
            say what status changed TO). This service dispatches only on
            "disabled".
