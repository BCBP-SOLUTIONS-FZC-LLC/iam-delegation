{{- if .Values.cronJobs.activation.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "iam-delegation.fullname" . }}-activation
  labels:
    {{- include "iam-delegation.labels" . | nindent 4 }}
    app.kubernetes.io/component: cronjob-activation
spec:
  schedule: {{ .Values.cronJobs.activation.schedule | quote }}
  concurrencyPolicy: {{ .Values.cronJobs.activation.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.cronJobs.activation.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.cronJobs.activation.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      activeDeadlineSeconds: {{ .Values.cronJobs.activation.activeDeadlineSeconds }}
      backoffLimit: 2
      template:
        metadata:
          labels:
            {{- include "iam-delegation.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: cronjob-activation
          annotations:
            {{- if .Values.existingSecret }}
            rotationEpoch: {{ .Values.rotationEpoch | default "0" | quote }}
            {{- else }}
            checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
            {{- end }}
        spec:
          serviceAccountName: {{ include "iam-delegation.serviceAccountName" . }}
          restartPolicy: OnFailure
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: delegation-activation
              image: "{{ .Values.image.repository }}:{{ include "iam-delegation.imageTag" . }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              # Same image as the server Deployment (single Dockerfile) —
              # override the entrypoint to run the reconciler binary
              # instead of the default /iam-delegation-server.
              command: ["/iam-delegation-reconciler"]
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              # --job=delegation-activation selects DLG-D25 (the
              # cross-service future-OOO bug fix's forward-sweep
              # counterpart to delegation-expiry, cronjob-expiry.yaml) out
              # of the single iam-delegation-reconciler binary, which also
              # hosts the review and cleanup entry points
              # (cronjob-review.yaml / cronjob-cleanup.yaml).
              # cmd/reconciler/main.go MUST parse a `--job` flag accepting
              # exactly these four values (delegation-expiry |
              # delegation-activation | delegation-review |
              # delegation-cleanup) — this is this chart's own convention
              # (LLD §16.1 leaves the dispatch mechanism unspecified), kept
              # in one place (.Values.cronJobs.*.jobName) so it can't drift
              # between the four CronJob templates.
              args:
                - "--job={{ .Values.cronJobs.activation.jobName }}"
              env:
                {{- range $key, $val := .Values.env }}
                - name: {{ $key }}
                  value: {{ $val | quote }}
                {{- end }}
                # Rows-per-tick cap shared by all four jobs (LLD §16.3) —
                # raise this or shorten a job's schedule if a job starts
                # saturating.
                - name: CRON_BATCH_LIMIT
                  value: {{ .Values.cronJobs.batchLimit | quote }}
                {{- $secretName := include "iam-delegation.secretName" . }}
                {{- range .Values.envFromSecret }}
                - name: {{ . }}
                  valueFrom:
                    secretKeyRef:
                      name: {{ $secretName }}
                      key: {{ . }}
                {{- end }}
              resources:
                {{- toYaml .Values.cronJobs.activation.resources | nindent 16 }}
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
