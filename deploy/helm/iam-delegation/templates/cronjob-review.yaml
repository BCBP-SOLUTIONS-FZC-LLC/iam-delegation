{{- if .Values.cronJobs.review.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "iam-delegation.fullname" . }}-review
  labels:
    {{- include "iam-delegation.labels" . | nindent 4 }}
    app.kubernetes.io/component: cronjob-review
spec:
  schedule: {{ .Values.cronJobs.review.schedule | quote }}
  concurrencyPolicy: {{ .Values.cronJobs.review.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.cronJobs.review.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.cronJobs.review.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      activeDeadlineSeconds: {{ .Values.cronJobs.review.activeDeadlineSeconds }}
      backoffLimit: 2
      template:
        metadata:
          labels:
            {{- include "iam-delegation.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: cronjob-review
          annotations:
            {{- if .Values.existingSecret }}
            rotationEpoch: {{ .Values.rotationEpoch | default "0" | quote }}
            {{- else }}
            checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
            {{- end }}
        spec:
          serviceAccountName: {{ include "iam-delegation.serviceAccountName" . }}
          restartPolicy: OnFailure
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: delegation-review
              image: "{{ .Values.reconcilerImage.repository }}:{{ include "iam-delegation.reconcilerImageTag" . }}"
              imagePullPolicy: {{ .Values.reconcilerImage.pullPolicy }}
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              # --job=delegation-review selects DLG-I2 (LLD §11.4 — the dual
              # 7d/3d review-window warning sweep, then auto-end with
              # ended_reason=review_expired, DLG-D6/DLG-D7) out of the single
              # iam-delegation-reconciler binary, which also hosts the
              # expiry and cleanup entry points (cronjob-expiry.yaml /
              # cronjob-cleanup.yaml). cmd/reconciler/main.go MUST parse a
              # `--job` flag accepting exactly these three values
              # (delegation-expiry | delegation-review | delegation-cleanup)
              # — this is this chart's own convention, kept in one place
              # (.Values.cronJobs.*.jobName) so it can't drift between the
              # three CronJob templates.
              args:
                - "--job={{ .Values.cronJobs.review.jobName }}"
              env:
                {{- range $key, $val := .Values.env }}
                - name: {{ $key }}
                  value: {{ $val | quote }}
                {{- end }}
                # Rows-per-tick cap shared by all three jobs (LLD §16.3) —
                # raise this or shorten a job's schedule if a job starts
                # saturating.
                - name: CRON_BATCH_LIMIT
                  value: {{ .Values.cronJobs.batchLimit | quote }}
                {{- $secretName := include "iam-delegation.secretName" . }}
                {{- range .Values.envFromSecret }}
                - name: {{ . }}
                  valueFrom:
                    secretKeyRef:
                      name: {{ $secretName }}
                      key: {{ . }}
                {{- end }}
              resources:
                {{- toYaml .Values.cronJobs.review.resources | nindent 16 }}
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
