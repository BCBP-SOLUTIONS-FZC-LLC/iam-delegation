apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "iam-delegation.fullname" . }}
  labels:
    {{- include "iam-delegation.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "iam-delegation.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # maxSurge: 0 keeps rollout node-count neutral. With hard pod
      # anti-affinity below, a surge pod cannot be scheduled when every node
      # already holds a replica — the rollout would stall indefinitely. Use
      # maxUnavailable: 1 instead. Mirrors iam-tender-acl's identical
      # rollingUpdate policy.
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        {{- include "iam-delegation.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.existingSecret }}
        # When using an external secret (ESO / CSI), bump rotationEpoch to
        # force a rollout after secret rotation:
        #   helm upgrade ... --set rotationEpoch=$(date +%s)
        rotationEpoch: {{ .Values.rotationEpoch | default "0" | quote }}
        {{- else }}
        # Force rollout when the self-managed Secret changes (checksum
        # triggers pod recycling).
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "iam-delegation.serviceAccountName" . }}
      # 30s HTTP+metrics graceful-shutdown budget plus buffer for the
      # in-process delegation-cascade-q SQS consumer to finish its
      # in-flight message (LLD §16.4) — at-least-once delivery +
      # processed_events dedup makes a redelivery safe if this is exceeded.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          # cmd/server (LLD §16.1): serves DLG-1..7/DLG-I1..I4 AND runs the
          # delegation-cascade-q SQS consumer in-process via errgroup — the
          # default entrypoint baked into this image. The four CronJobs
          # run the SAME image with `command` overridden to the reconciler
          # binary (see templates/cronjob-*.yaml).
          image: "{{ .Values.image.repository }}:{{ include "iam-delegation.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.httpPort }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
              protocol: TCP
          env:
            {{- range $key, $val := .Values.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            {{- $secretName := include "iam-delegation.secretName" . }}
            {{- range .Values.envFromSecret }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ . }}
            {{- end }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        # Hard anti-affinity: require pods to land on different nodes.
        # preferred (soft) anti-affinity allows all replicas on one node — a
        # single node failure would take the service to zero despite the PDB.
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "iam-delegation.selectorLabels" . | nindent 18 }}
              topologyKey: kubernetes.io/hostname
