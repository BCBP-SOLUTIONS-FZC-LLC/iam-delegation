# Default values for iam-delegation.
#
# Deployment topology (LLD §16.1): a "server" Deployment (2-4 replicas, HPA)
# serves the HTTP API (DLG-1..7, DLG-I1..I4) AND runs the
# delegation-cascade-q SQS consumer (§11.5) in-process — same "one process,
# two responsibilities" pattern as iam-tender-acl / iam-user-profile. The
# four CronJobs (delegation-expiry/-activation/-review/-cleanup, §16.3) run from the
# SAME image (it carries both binaries — see the repo-root Dockerfile),
# with each CronJob template overriding `command` to invoke
# /iam-delegation-reconciler --job=<name> — mirrors iam-user-profile's
# one-image pattern (its signature-erasure-cronjob.yaml does the same).

replicaCount: 2

image:
  repository: ghcr.io/bcbp-solutions-fzc-llc/iam-delegation
  pullPolicy: IfNotPresent
  tag: ""  # overridden by CI to the git SHA / release version; falls back to Chart.appVersion

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  # Annotations added to the ServiceAccount — use for IRSA on EKS:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/iam-delegation
  annotations: {}

service:
  type: ClusterIP
  httpPort: 8080
  metricsPort: 9090

# HPA — CPU/memory always on; the cascade-queue-depth-based scaling note in
# LLD §16.3 ("HPA on delegation-cascade-q depth") requires an SQS-queue
# custom-metrics adapter (e.g. KEDA or the same prometheus-adapter pattern
# iam-tender-acl documents for RPS) that is out of scope for this initial
# scaffold — targetRPSPerReplica is kept as the same opt-in mechanism
# iam-tender-acl exposes, left at 0 (disabled) until that adapter exists.
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  targetRPSPerReplica: 0  # set > 0 to enable RPS-based scaling once prometheus-adapter is configured

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

# Non-secret env, rendered directly onto the server container (see
# templates/deployment.yaml). Anything with a credential (DATABASE_URL,
# VALKEY_PASSWORD) lives in envFromSecret below. Mirrors LLD §15's
# values-prod.yaml excerpt verbatim, flattened to env-var form.
env:
  LOG_LEVEL: "info"
  ENVIRONMENT: "production"
  APP_ENV: "production"
  APP_NAME: "iam-delegation"

  # ElastiCache Valkey — "del:" keyspace is a compile-time constant, not
  # env-driven (LLD §9/§15). No auth token is embedded in this URL form;
  # VALKEY_PASSWORD (if any) is in envFromSecret.
  VALKEY_ADDR: "valkey.iam-delegation.svc.cluster.local:6379"
  LIST_CACHE_TTL_SECONDS: "60"
  IDEMPOTENCY_TTL_SECONDS: "86400"

  # DEL-6 availability-first coordination — User Profile is the
  # authoritative owner of user_availability (LLD §1, §6.3).
  USER_PROFILE_BASE_URL: "http://iam-user-profile.iam.svc.cluster.local"
  USER_PROFILE_TIMEOUT_MS: "3000"

  # The two lost composite membership FKs -> two synchronous grant-time
  # checks against Core (DLG-D3, §7.6.2). ≤50ms p99 expected; 3000ms is the
  # LLD §15 client timeout ceiling (not the per-call SLO target — see
  # LLD §14.1 for the 50ms figure).
  ORG_MEMBERSHIP_BASE_URL: "http://iam-org-membership.iam.svc.cluster.local"
  ORG_MEMBERSHIP_MEMBERSHIP_CHECK_TIMEOUT_MS: "3000"

  # Tenant delegation policy defaults (DLG-D2) — used only when a tenant has
  # no delegation_tenant_settings row (LLD §15).
  POLICY_DEFAULT_MAX_DURATION_DAYS: "90"
  POLICY_DEFAULT_REVIEW_WINDOW_DAYS: "90"

  # 3-day daily-cascade review warning (DLG-D7/DLG-Q6, §11.4) — the
  # days_remaining ∈ {3,2,1} window is a compile-time literal in
  # cmd/reconciler/jobs/delegation_review.go, not env-driven; no config knob
  # exists for it.

  # Dedicated event topic (DLG-D5/DLG-Q1) — Core's AsyncAPI drops these
  # events entirely; this service is both producer and consumer (§6.3).
  # REQUIRED — cmd/server/config.go fails fast at startup if either of the
  # next two is empty. No generic in-cluster default exists (real ARN/URL
  # depends on the environment's AWS account) — set per environment.
  SNS_TOPIC_ARN: ""
  CASCADE_QUEUE_URL: ""
  CASCADE_SQS_CONCURRENCY: "4"
  AWS_REGION: "ap-south-1"
  # Set to the Glue Schema Registry name (iam-delegation-events) to activate
  # eventbus.GlueCodec at publish time; empty → NoopCodec (dev/test only).
  # See docs/runbook-schema-registry.md.
  GLUE_REGISTRY_NAME: ""

  # Outbox runner — platform-events config.LoadOutbox / RunnerConfigFromEnv
  # (iam-user-profile / iam-org-membership). Historical 500ms / concurrency-4
  # / 2s jitter / 10m claim-lease values; library defaults apply only when
  # these are unset.
  OUTBOX_POLL_INTERVAL: "500ms"
  OUTBOX_BATCH_SIZE: "50"
  OUTBOX_MAX_ATTEMPTS: "5"
  OUTBOX_DRAIN_TIMEOUT: "30s"
  OUTBOX_PUBLISH_CONCURRENCY: "4"
  OUTBOX_PUBLISH_TIMEOUT: "10s"
  OUTBOX_STARTUP_JITTER: "2s"
  OUTBOX_CLAIM_LEASE_DURATION: "10m"

  # OpenTelemetry — OTLP/gRPC via platform-gincommon's
  # ObservabilityMiddlewares (port 4317, not the legacy OTLP/HTTP 4318).
  OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector.observability.svc.cluster.local:4317"
  OTEL_SERVICE_NAME: "iam-delegation"

  # Dedicated /metrics listener (cmd/server), separate from the API port.
  METRICS_PORT: "9090"

  # Postgres pool sizing (pgcommon.ConfigFromEnv()) — logical database name
  # ("delegation", LLD §7) is embedded in DATABASE_URL itself, not a
  # separate env var. PG_BOUNCER_MODE / PG_STATEMENT_TIMEOUT / PG_MIN_CONNS
  # match iam-realm-provisioner: transaction pooling in production, MinConns
  # 0 so pgcommon does not keep idle backends against PgBouncer.
  PG_MAX_CONNS: "10"
  PG_MIN_CONNS: "0"
  PG_BOUNCER_MODE: "true"
  PG_STATEMENT_TIMEOUT: "5s"
  PG_SLOW_QUERY_THRESHOLD: "200ms"

  # Docs surface (optional) — Swagger UI is always mounted outside
  # production; DOCS_ENABLED opts it into production too, and
  # DOCS_AUTH_TOKEN (envFromSecret below) additionally bearer-auth-gates it
  # there.
  DOCS_ENABLED: "false"

# Env vars whose value comes from a Kubernetes Secret. Keys must be present
# in either .Values.existingSecret or .Values.secretValues. Shared by both
# the server Deployment and the four reconciler CronJobs (they all need
# DATABASE_URL/SYSTEM_DATABASE_URL/VALKEY_PASSWORD). The server owns
# migrations at startup (LLD §16.4); CronJobs still receive
# MIGRATION_DATABASE_URL because envFromSecret is shared.
envFromSecret:
  - DATABASE_URL
  - SYSTEM_DATABASE_URL
  - MIGRATION_DATABASE_URL
  - VALKEY_PASSWORD
  - DOCS_AUTH_TOKEN
  - GLUE_REGISTRY_ARN

# existingSecret — preferred for production. Set to the name of a
# pre-existing Kubernetes Secret whose keys match envFromSecret. When set,
# the chart creates no Secret resource and secretValues is ignored.
#
# DATABASE_URL here MUST be the runtime app role (delegation_app), which has
# no BYPASSRLS. SYSTEM_DATABASE_URL and MIGRATION_DATABASE_URL MUST both be
# the BYPASSRLS delegation_migrator role — the server pod applies migrations
# itself at startup (LLD §7.4/§16.4) and sysPool runs cross-tenant sweeps
# (cron, cascade processed_events, active-gauge exporter). There is no
# separate migrate Job in this chart.
existingSecret: ""

# rotationEpoch — used only when existingSecret is set. Bump this value to
# trigger a rolling restart after an external secret is rotated:
#   helm upgrade ... --set rotationEpoch=$(date +%s)
rotationEpoch: "0"

# Secret values — used ONLY when existingSecret is empty.
# Pass via --set or a Helm secrets plugin (never commit real values).
secretValues:
  DATABASE_URL: ""
  SYSTEM_DATABASE_URL: ""
  MIGRATION_DATABASE_URL: ""
  VALKEY_PASSWORD: ""
  DOCS_AUTH_TOKEN: ""
  # For IAM-policy-scoping documentation/validation only — not read by the
  # Go runtime. See deploy/iam/policy.tf.example's glue_registry_arn.
  GLUE_REGISTRY_ARN: ""

# 30s HTTP+metrics server graceful shutdown budget + buffer for the SQS
# cascade consumer to finish its in-flight message (LLD §16.4: "at-least-
# once + processed_events" dedup makes a redelivery safe if this is
# exceeded).
terminationGracePeriodSeconds: 30

# podDisruptionBudget — ensures at least 1 pod survives voluntary
# disruptions (node drains, cluster upgrades). With minReplicas: 2 keep
# minAvailable=1 so a single node drain doesn't take the service to zero.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532      # distroless nonroot UID
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []

# startupProbe covers a slow cold start (Postgres pool warmup, AWS SDK
# config resolution) before liveness/readiness take over.
startupProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 2
  periodSeconds: 5
  failureThreshold: 12   # 12 x 5s = 60s startup budget
  timeoutSeconds: 3

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 0  # startupProbe handles the initial delay
  periodSeconds: 15
  failureThreshold: 3
  timeoutSeconds: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 0
  periodSeconds: 10
  failureThreshold: 3
  timeoutSeconds: 3

# NetworkPolicy — enabled by default (LLD §13.2). Public API traffic
# (DLG-1..7) reaches the "http" port via the gateway/mesh; /internal/*
# (DLG-I1..I4) is mesh-only mTLS, reached only from same-namespace callers
# (Core, Workflow) via the internal-route guard at the application layer —
# both share the same "http" port at the network layer, exactly like
# iam-tender-acl's TAC-1..3 (public) / TAC-4 (internal) split. :9090/metrics
# is restricted to the monitoring namespace only.
# Envoy Gateway: data-plane Envoy proxy pods run in the same namespace as the
# Gateway resource (not envoy-gateway-system, which is the control plane).
# Set ingressControllerNamespaceSelector to the Gateway's namespace label and
# ingressControllerPodSelector to the Envoy pod labels so the NetworkPolicy
# allows only gateway traffic, not arbitrary pods in that namespace.
networkPolicy:
  enabled: true
  # Namespace label selector for the ingress controller / Envoy Gateway data-plane.
  # nginx-ingress:   kubernetes.io/metadata.name: ingress-nginx
  # Envoy Gateway:   kubernetes.io/metadata.name: <namespace where Gateway lives>
  ingressControllerNamespaceSelector:
    kubernetes.io/metadata.name: envoy-gateway-system
  # Optional pod label selector — combined with namespaceSelector (logical AND).
  # Envoy Gateway data-plane pods carry:
  #   gateway.envoyproxy.io/owning-gateway-name: <gateway-name>
  #   gateway.envoyproxy.io/owning-gateway-namespace: <gateway-namespace>
  # Leave empty ({}) to allow all pods in the ingress controller namespace.
  ingressControllerPodSelector: {}
  metricsIngress:
    enabled: true
    namespaceSelector:
      kubernetes.io/metadata.name: monitoring
    podSelector:
      app.kubernetes.io/name: prometheus
  additionalIngressRules: []
  additionalEgressRules: []

# ServiceMonitor — requires kube-prometheus-stack (monitoring.coreos.com/v1
# CRD). PrometheusRule (alerting rules) is also gated on this flag — no
# scrape means no metrics, which means every alert stays permanently
# inactive. Set to true (and add the correct serviceMonitorSelector labels)
# before relying on any alert in deploy/monitoring/ or
# deploy/helm/iam-delegation/templates/prometheusrule.yaml.
serviceMonitor:
  enabled: true
  interval: "30s"
  scrapeTimeout: "10s"
  # Labels added to the ServiceMonitor (must match your Prometheus operator's
  # serviceMonitorSelector — typically: release: kube-prometheus-stack).
  additionalLabels: {}
  relabelings: []
  namespaceSelector: {}

# Ingress — disabled by default; this service is normally reached only
# through the shared Envoy gateway/mesh (LLD §16.1: "one Envoy upstream for
# /api/v1/delegations*"). Enable only if a caller sits outside the cluster.
ingress:
  enabled: false
  type: HTTPRoute

  hosts:
    - host: iam-delegation.internal.example.com
      paths:
        - path: /api/v1
          pathType: PathPrefix

  # ── Gateway API (type: HTTPRoute) ────────────────────────────────────────
  # Reference the Gateway resource that Envoy Gateway manages.
  # The Gateway must be deployed separately (e.g. via the envoy-gateway Helm chart).
  #
  # Minimal example:
  #   apiVersion: gateway.networking.k8s.io/v1
  #   kind: Gateway
  #   metadata:
  #     name: iam-gateway
  #     namespace: envoy-gateway-system
  #   spec:
  #     gatewayClassName: eg
  #     listeners:
  #       - name: https
  #         protocol: HTTPS
  #         port: 443
  #         tls:
  #           mode: Terminate
  #           certificateRefs:
  #             - name: iam-tls-secret
  gateway:
    name: ""              # required — name of the Gateway resource
    namespace: ""         # optional — defaults to the release namespace
    sectionName: ""       # optional — target a specific listener (e.g. "https")

  securityPolicy:
    enabled: false
    cors:
      enabled: false
      allowOrigins: []
      allowMethods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      allowHeaders:
        - Authorization
        - Content-Type
        - Idempotency-Key
        - X-Tenant-Id
        - X-User-Id
        - X-User-Roles
      maxAge: "86400"
    rateLimit:
      enabled: false
      requestsPerUnit: 1000
      unit: Second          # Second | Minute | Hour

  className: ""
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  tls: []
  #  - secretName: iam-delegation-tls
  #    hosts:
  #      - iam-delegation.internal.example.com

# ── Reconciler CronJobs (LLD §15 crons block / §16.1/§16.3) ────────────────
# Each CronJob runs the SAME image as the Deployment (image above), with
# `command` overridden to the iam-delegation-reconciler binary and a
# different --job=<name> argument selecting
# which entry point under cmd/reconciler/jobs/ to run — see
# templates/cronjob-*.yaml for the exact convention (this is this chart's
# own convention; cmd/reconciler/main.go's actual flag-parsing is owned by
# whichever agent wires cmd/, kept consistent with it here).
cronJobs:
  expiry:
    enabled: true
    schedule: "*/5 * * * *"      # DLG-I1 (LLD §11.3) — availability-first, self-retrying
    jobName: delegation-expiry
    concurrencyPolicy: Forbid
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
    activeDeadlineSeconds: 240
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  activation:
    enabled: true
    schedule: "*/5 * * * *"      # DLG-D25 — cross-service future-OOO bug fix, mirrors expiry's cadence
    jobName: delegation-activation
    concurrencyPolicy: Forbid
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
    activeDeadlineSeconds: 240
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  review:
    enabled: true
    schedule: "0 * * * *"        # DLG-I2 (LLD §11.4) — 3-day daily-cascade warn, then auto-end
    jobName: delegation-review
    concurrencyPolicy: Forbid
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
    activeDeadlineSeconds: 540
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  cleanup:
    enabled: true
    schedule: "0 4 1 * *"        # soft-delete hard-purge (LLD §11.6/§18.4), monthly
    jobName: delegation-cleanup
    concurrencyPolicy: Forbid
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
    activeDeadlineSeconds: 1800
    # processed_events prune window in days (LLD §18.4). Realm provisioner
    # defaults to 8 with a dedicated CronJob; this service keeps the LLD's
    # 30-day window bundled into monthly cleanup.
    processedEventsTTLDays: 30
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  # Rows-per-tick cap shared by all four jobs (LLD §15 crons.batchLimit) —
  # raise this or shorten a job's schedule if it starts saturating
  # (LLD §16.3).
  batchLimit: 50
