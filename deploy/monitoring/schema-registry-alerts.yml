# Prometheus alerting rules for the Glue Schema Registry CI pipeline.
#
# Metrics are emitted by the `platform-schemagov` CLI's `metrics` subcommand
# (ghcr.io/bcbp-solutions-fzc-llc/platform-schemagov:0.4) on every
# .github/workflows/schema-registry.yml run (the "Emit metrics" step). For
# continuous time-series, configure a Prometheus Pushgateway and set the
# PUSHGATEWAY_URL secret in the staging/production GitHub Environments.
#
# Deploy via PrometheusRule CRD (kube-prometheus-stack) or include in a
# Prometheus --rule-files directory — same mechanism as this directory's
# app-alerts.yml / prometheus-adapter-rule.yaml.
#
# Thresholds mirror the defaults passed by schema-registry.yml's "Emit
# metrics" step; adjust to match the ORPHAN_ALERT_THRESHOLD /
# REGISTRATIONS_SPIKE_THRESHOLD GitHub Environment variables if changed.
#
# Labels
# ──────
# All metrics carry:
#   environment — "staging" | "production"
#   registry    — value of GLUE_REGISTRY_NAME (iam-delegation-events)
#
# glue_schema_version additionally carries:
#   schema — individual schema name (DelegationStarted | DelegationEnded | DelegationReviewRequested)
#   status — "created" | "new_version" | "unchanged"

groups:
  - name: schema_registry
    rules:

      # ── Breaking change blocked ──────────────────────────────────────────────
      # The CI diff step already fails the pipeline on breaking changes; this rule
      # captures the metric trail for ops dashboards and async alerting to Slack /
      # PagerDuty without relying solely on a failed GitHub Actions run.
      - alert: SchemaBreakingChangeBlocked
        expr: glue_schema_registry_breaking_changes_blocked > 0
        for: 0m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: >-
            Breaking schema change blocked in {{ $labels.environment }}
          description: >-
            {{ $value | humanize }} breaking change(s) were blocked by the CI diff check
            in Glue registry {{ $labels.registry }} ({{ $labels.environment }}).
            A developer attempted an incompatible schema change. Registration was blocked.
            Apply a versioned event type (e.g. DelegationEnded.v2) and follow the migration
            protocol in api/asyncapi.yaml § "Schema Evolution Rules".

      # ── Orphan accumulation ──────────────────────────────────────────────────
      # Orphaned schemas are registered in Glue but have no corresponding file in
      # internal/eventschema/. They accumulate when schemas are renamed or retired
      # without being removed from the registry. Default threshold: 5.
      - alert: SchemaOrphanCountHigh
        expr: glue_schema_registry_orphaned_schemas > 5
        for: 0m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: >-
            High orphaned schema count in {{ $labels.environment }}
          description: >-
            {{ $value | humanize }} schemas are registered in Glue registry
            {{ $labels.registry }} ({{ $labels.environment }}) but have no
            corresponding file in internal/eventschema/.
            Trigger schema-prune.yml (dry-run first) for a candidate list, or
            re-run with dry_run=false to archive and remove them (archives to
            docs/schema-archive/ before deleting).

      # ── Registration spike ───────────────────────────────────────────────────
      # This service registers at most 3 schemas per run. A spike suggests a
      # bulk import, schema reset, or misconfiguration. Default threshold: 10.
      - alert: SchemaRegistrationSpike
        expr: glue_schema_registry_registrations_total > 10
        for: 0m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: >-
            Unusually high schema registration count in {{ $labels.environment }}
          description: >-
            {{ $value | humanize }} schemas were processed in a single registration run
            for registry {{ $labels.registry }} ({{ $labels.environment }}).
            This exceeds the expected maximum for this service (3 schemas —
            DelegationStarted, DelegationEnded, DelegationReviewRequested).
            Verify the changes are intentional — unexpected spikes may indicate a
            bulk import, schema directory reset, or misconfigured GLUE_REGISTRY_NAME.

      # ── Per-schema churn ─────────────────────────────────────────────────────
      # glue_schema_version holds the current version number per schema.
      # delta() over 7 days measures how many new versions were registered.
      # Requires continuous Pushgateway scraping for accurate results; with
      # infrequent CI-driven pushes the delta window may span fewer data points.
      # Increase the threshold for schemas expected to evolve frequently.
      - alert: SchemaVersionChurn
        expr: delta(glue_schema_version[7d]) > 3
        for: 0m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: >-
            Schema {{ $labels.schema }} has churned {{ $value | humanize }} versions in 7d
          description: >-
            Schema {{ $labels.schema }} in registry {{ $labels.registry }}
            ({{ $labels.environment }}) received more than 3 new version registrations
            in the last 7 days. Frequent incompatible changes require consumer migration
            work on every cycle. Consider batching schema changes, stabilising the
            contract, or promoting the schema to a versioned type (e.g. {{ $labels.schema }}.v2).
