# LocalStack Pro override — enables Glue Schema Registry.
# Requires a valid LOCALSTACK_AUTH_TOKEN (set in .env).
#
#   LOCALSTACK_AUTH_TOKEN=<your-token> \
#   docker compose -f docker-compose.yml -f docker-compose.pro.yml up
#
# With Pro:
#   - Glue Schema Registry: set GLUE_REGISTRY_NAME in .env to activate GlueCodec
#   - All other services (SNS, SQS) work identically to community
services:
  localstack:
    image: localstack/localstack-pro:latest
    environment:
      SERVICES: sqs,sns,glue
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN}
    volumes:
      - ./internal/eventschema:/etc/localstack/init/schemas:ro

  iam-delegation:
    environment:
      GLUE_REGISTRY_NAME: ${GLUE_REGISTRY_NAME:-iam-delegation-events}
      GLUE_REGISTRY_ARN: ${GLUE_REGISTRY_ARN:-}
