# docker-compose.yml
#
# NOTE: This file is for LOCAL DEVELOPMENT ONLY. It is not used in any
# staging/production deployment path (see deploy/helm/iam-delegation for
# that). Credentials and connection strings below are dev-only defaults
# and must never be reused outside a developer's machine.
#
# Host ports are chosen to avoid colliding with the sibling IAM services'
# own docker-compose.yml stacks (iam-user-profile: 5433/5434/6379/4566,
# iam-org-membership: 5533/5534/6380/4567/4500 [floci/floci-ui],
# iam-group-mapping: 5432/6379/4568, iam-catalog-admin: 5535/6381,
# iam-tender-acl: 5536/6382/4569) so all can run side-by-side on one host.
# This service: 5537/6383/4570/4501.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      # Dev-only credentials. Production uses externally managed secrets.
      POSTGRES_DB: delegation
      POSTGRES_USER: delegation
      POSTGRES_PASSWORD: delegation
    ports:
      - "5537:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delegation -d delegation"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6383:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  floci:
    # Floci — open-source (MIT), always-free AWS emulator; drop-in
    # LocalStack replacement (iam-org-membership uses the same image).
    # Unlike LocalStack Community, Glue Schema Registry ships in floci's
    # free tier, so this single service covers SNS + SQS + Glue with no Pro
    # tier / auth token needed — scripts/init-floci.sh provisions the
    # iam-delegation-events topic, delegation-cascade-q, the three
    # downstream fan-out queues, and the Glue registry + all 4 schemas.
    # This service both publishes (iam-delegation-events via the outbox →
    # SNS, LLD §10.4) and consumes (delegation-cascade-q, §11.5/§11.6),
    # unlike iam-tender-acl which is SQS-only.
    image: floci/floci:2.1.0-compat
    ports:
      # Host 4570 → container 4566. 4566/4567 are claimed by
      # iam-user-profile's/iam-org-membership's own emulator instances so
      # all three can run side-by-side.
      - "4570:4566"
    environment:
      FLOCI_DEFAULT_REGION: ap-south-1
      FLOCI_DEFAULT_ACCOUNT_ID: "000000000000"
      # Rewrites the host in SQS QueueUrl / SNS TopicArn responses (e.g.
      # http://floci:4566/... instead of http://localhost:4566/...) so the
      # floci-ui container below — which resolves those URLs directly,
      # AWS-SDK-console fashion — can actually reach them from inside its
      # own container. Without this, floci-ui's queue list loads fine but
      # every per-queue attribute (message counts included) silently comes
      # back empty.
      FLOCI_HOSTNAME: floci
    volumes:
      - floci-data:/app/data
      - ./scripts/init-floci.sh:/etc/floci/init/ready.d/init-floci.sh
      - ./internal/eventschema:/etc/floci/init/schemas:ro
    healthcheck:
      # The compat image's AWS CLI defaults to region us-east-1 regardless
      # of FLOCI_DEFAULT_REGION — floci treats region as an isolation
      # boundary, so --region must be explicit here. Checks for the LAST
      # resource init-floci.sh creates (the DelegationEscalationRequested
      # Glue schema), not just SNS reachability — the SNS topic exists
      # seconds into the script while Glue registration is still running,
      # so a shallow `sns list-topics` check would report "healthy" (and
      # unblock iam-delegation's depends_on) before GLUE_REGISTRY_NAME's
      # schema actually exists, crashing GlueCodec's startup prefetch.
      test: ["CMD", "aws", "--region", "ap-south-1", "glue", "get-schema",
             "--schema-id", "RegistryName=iam-delegation-events,SchemaName=DelegationEscalationRequested"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  floci-ui:
    # Web console for floci — browse SNS/SQS/Glue resources at
    # http://localhost:4501 instead of the aws CLI. Talks to `floci` over
    # the compose network. Shows queue/topic metadata including live
    # message counts, but not message bodies or SNS topics/subscriptions —
    # see README.md's "Testing domain events locally" for the CLI cookbook.
    image: floci/floci-ui:0.5.0
    ports:
      # Host 4501 → container 4500. 4500 is claimed by
      # iam-org-membership's own floci-ui instance.
      - "4501:4500"
    environment:
      AWS_REGION: ap-south-1
      AWS_ACCESS_KEY_ID: test
      # NOT the same as AWS_ENDPOINT_URL below — floci-ui's own
      # connectivity probe reads this separate, floci-ui-specific var
      # (upstream default: http://localhost:4566, which from *inside its
      # own container* means itself, not `floci`).
      FLOCI_ENDPOINT: http://floci:4566
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL: http://floci:4566
      PORT: "4500"
    depends_on:
      floci:
        condition: service_healthy

  iam-delegation:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      floci:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      HTTP_PORT: "8080"
      METRICS_PORT: "9090"
      LOG_LEVEL: debug
      ENVIRONMENT: development
      APP_ENV: dev
      APP_NAME: iam-delegation

      # The runtime app role — delegation_app has no BYPASSRLS, so Row-
      # Level Security is actually enforced even in this dev stack. The
      # binary self-migrates at startup (postgres.Migrate, LLD §7.4/§16.4)
      # using MIGRATION_DATABASE_URL below, then opens its runtime pool
      # against DATABASE_URL — there is no separate migrate service/Job
      # here, matching how it runs in production.
      DATABASE_URL: postgres://delegation_app:delegation_app_dev_password@postgres:5432/delegation?sslmode=disable
      # BYPASSRLS role for startup migration AND the sysPool (cron sweeps,
      # cascade processed_events, active-gauge exporter). Direct Postgres
      # in this compose stack — PG_BOUNCER_MODE stays false.
      MIGRATION_DATABASE_URL: postgres://delegation:delegation@postgres:5432/delegation?sslmode=disable
      SYSTEM_DATABASE_URL: postgres://delegation:delegation@postgres:5432/delegation?sslmode=disable
      PG_MAX_CONNS: "10"
      PG_MIN_CONNS: "2"
      PG_BOUNCER_MODE: "false"
      PG_STATEMENT_TIMEOUT: "5s"
      PG_SLOW_QUERY_THRESHOLD: 200ms

      VALKEY_ADDR: valkey:6379
      VALKEY_PASSWORD: ""
      LIST_CACHE_TTL_SECONDS: "60"
      IDEMPOTENCY_TTL_SECONDS: "86400"

      # DEL-6 availability-first coordination — not part of this compose
      # stack; run iam-user-profile separately and point this at it, or a
      # stub, or accept DEL-6's deferred-and-retry degraded path.
      USER_PROFILE_BASE_URL: http://host.docker.internal:8080
      USER_PROFILE_TIMEOUT_MS: "3000"

      # The two synchronous grant-time membership-existence checks (DLG-D3,
      # LLD §7.6.2) — not part of this compose stack either; run
      # iam-org-membership separately and point this at it.
      ORG_MEMBERSHIP_BASE_URL: http://host.docker.internal:8081
      ORG_MEMBERSHIP_MEMBERSHIP_CHECK_TIMEOUT_MS: "3000"

      POLICY_DEFAULT_MAX_DURATION_DAYS: "90"
      POLICY_DEFAULT_REVIEW_WINDOW_DAYS: "90"
      REVIEW_WARN_EARLY_DAYS: "7"
      REVIEW_WARN_LATE_DAYS: "3"

      # SNS_TOPIC_ARN/CASCADE_QUEUE_URL are required (cmd/server/config.go
      # fails fast if either is empty). Names/topic match
      # scripts/init-floci.sh and api/asyncapi.yaml.
      SNS_TOPIC_ARN: arn:aws:sns:ap-south-1:000000000000:iam-delegation-events

      # floci — container-internal port is always 4566 regardless of the
      # host-side mapping above. AWS_ENDPOINT_URL is honored automatically
      # by aws-sdk-go-v2's default config loader; no code change is needed
      # to redirect SNS/SQS/Glue calls here instead of real AWS.
      CASCADE_QUEUE_URL: http://floci:4566/000000000000/delegation-cascade-q
      AWS_REGION: ap-south-1
      # Non-empty by default — floci includes Glue Schema Registry in its
      # free tier (unlike LocalStack Community, which gates it behind Pro),
      # so the real GlueCodec wire format runs locally instead of falling
      # back to NoopCodec. scripts/init-floci.sh registers this registry +
      # all 4 schemas on floci startup.
      GLUE_REGISTRY_NAME: iam-delegation-events
      AWS_ENDPOINT_URL: http://floci:4566

      # Outbox runner — platform-events LoadOutbox. Keep historical values
      # so compose does not fall through to library defaults (5s poll / concurrency 1).
      OUTBOX_POLL_INTERVAL: 500ms
      OUTBOX_BATCH_SIZE: "50"
      OUTBOX_MAX_ATTEMPTS: "5"
      OUTBOX_DRAIN_TIMEOUT: 30s
      OUTBOX_PUBLISH_CONCURRENCY: "4"
      OUTBOX_PUBLISH_TIMEOUT: 10s
      OUTBOX_STARTUP_JITTER: 2s
      OUTBOX_CLAIM_LEASE_DURATION: 10m
      # Dummy static credentials — required so the SDK's credential chain
      # resolves from these env vars instead of falling through to the
      # EC2 IMDS provider, which would otherwise retry against
      # 169.254.169.254 (unreachable outside EC2) and fail with
      # "no EC2 IMDS role found ... host is down".
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test

      # OTLP/gRPC (platform-gincommon's ObservabilityMiddlewares) — not the
      # legacy OTLP/HTTP port 4318 some sibling services' compose files use.
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317

      DOCS_ENABLED: "false"
    restart: unless-stopped

volumes:
  postgres-data:
  floci-data:
